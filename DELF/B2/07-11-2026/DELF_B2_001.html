<html lang="fr" data-theme="light"><!-- light by default; the ◐ button switches to dark -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELF B2 Compréhension écrite 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#1d1f24; --muted:#5d6270; --line:#ddd6c8;
  --accent:#1f3a8a; --accent-soft:#e6ebf8; --good:#17734a; --good-soft:#e3f3ea;
  --bad:#b42318; --bad-soft:#fbe9e7; --warn:#a15c00; --warn-soft:#fff1d9;
  --hl:#ffe58a; --on-accent:#fff; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --paper:#1d2027; --ink:#e8e6e1; --muted:#a2a7b3; --line:#343844;
    --accent:#8aa6ff; --accent-soft:#232c45; --good:#5fd39a; --good-soft:#17301f;
    --bad:#ff8a7a; --bad-soft:#3a1e1b; --warn:#ffbf5e; --warn-soft:#3a2c14;
    --hl:#6b5a12; --on-accent:#111; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#15171c; --paper:#1d2027; --ink:#e8e6e1; --muted:#a2a7b3; --line:#343844;
  --accent:#8aa6ff; --accent-soft:#232c45; --good:#5fd39a; --good-soft:#17301f;
  --bad:#ff8a7a; --bad-soft:#3a1e1b; --warn:#ffbf5e; --warn-soft:#3a2c14;
  --hl:#6b5a12; --on-accent:#111; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* Top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;font-weight:600;background:var(--accent);color:var(--on-accent);text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;width:38px;height:38px}

/* Cover */
.cover{max-width:760px;margin:40px auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:36px 32px;box-shadow:var(--shadow)}
.cover .kicker{text-transform:uppercase;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.cover h1{font-family:"Source Serif 4",Georgia,serif;font-size:34px;line-height:1.15;margin:8px 0 4px}
.cover .sub{color:var(--muted);margin:0 0 24px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 24px}
.fact{border:1px solid var(--line);border-radius:12px;padding:14px}
.fact b{display:block;font-size:22px}
.fact span{color:var(--muted);font-size:13px}
.consignes{background:var(--accent-soft);border-radius:12px;padding:16px 20px;margin-bottom:24px}
.consignes h3{margin:0 0 8px;font-size:15px}
.consignes ul{margin:0;padding-left:20px}
.consignes li{margin:4px 0}
.prof{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin-bottom:28px;color:var(--muted);font-style:italic}

/* Results */
.results{margin:28px auto 8px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);scroll-margin-top:76px}
.res-top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.score{font-family:"Source Serif 4",Georgia,serif;font-size:64px;font-weight:700;line-height:1}
.score small{font-size:26px;color:var(--muted);font-weight:400}
.verdict{flex:1;min-width:240px}
.verdict h2{margin:0 0 6px;font-size:22px}
.verdict p{margin:0;color:var(--muted)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:8px}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.bd{border:1px solid var(--line);border-radius:12px;padding:14px}
.bd .t{font-size:13px;color:var(--muted)}
.bd .v{font-weight:700;font-size:18px;margin:2px 0 8px}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.grid-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.dot{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:13px;text-decoration:none}
.dot.ok{background:var(--good-soft);color:var(--good)}
.dot.ko{background:var(--bad-soft);color:var(--bad)}
.dot.na{background:var(--warn-soft);color:var(--warn)}
.res-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin-top:16px}

/* Exercise */
.exercise{margin:32px 0}
.ex-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.ex-head h2{margin:0;font-size:22px}
.ex-head .pts{margin-left:auto;font-weight:600;color:var(--muted)}
.ex-consigne{color:var(--muted);margin:6px 0 18px;font-style:italic}
.ex-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.ex-grid.solo{grid-template-columns:minmax(0,820px);justify-content:center}
.q-text .gap{display:inline-block;min-width:5em;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:baseline}
.q-text .dlg{display:block;font-weight:500;margin-top:4px}
.q-text .inst{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-bottom:4px}
.lvl{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px}

/* Document components (use these classes inside exercise.document) */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 30px;box-shadow:var(--shadow);font-family:"Source Serif 4",Georgia,serif;font-size:17.5px;line-height:1.7;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.doc .doc-title{font-size:25px;line-height:1.25;margin:0 0 6px;font-weight:700}
.doc .chapo{font-weight:600;margin:0 0 14px}
.doc .src{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.doc p{margin:0 0 12px}
.doc .itw-q{font-family:Inter,sans-serif;font-weight:600;font-size:15px;margin:18px 0 6px;color:var(--accent)}
.situation{font-family:Inter,sans-serif;font-size:15px;background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.situation p{margin:6px 0}
.situation ul{margin:4px 0 0;padding-left:20px}
.ad{position:relative;border:1px solid var(--line);border-radius:12px;padding:14px 16px 6px 60px;margin-bottom:12px;font-size:16px;line-height:1.6}
.ad h4{margin:0 0 4px;font-size:17px}
.ad-letter{position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 15px Inter,sans-serif}
.mail-head{font-family:Inter,sans-serif;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.mail-head div{margin:2px 0}
.mail-head span{display:inline-block;width:62px;color:var(--muted)}
.ev{transition:background .3s;border-radius:3px}
body.graded .ev{background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.ev.hl{background:var(--hl)!important;box-shadow:0 0 0 3px var(--hl)}

/* Questions */
.questions{display:flex;flex-direction:column;gap:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;scroll-margin-top:84px}
.q-head{display:flex;gap:12px;align-items:flex-start}
.q-num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:14px}
.q-text{flex:1;margin:3px 0 0;font-weight:600}
.q-pts{flex:none;font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px 42px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.opt input:focus-visible + .l{outline:2px solid var(--accent);outline-offset:2px}
body.graded .opt{cursor:default}
body.graded .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--good)!important;background:var(--good-soft)!important}
.opt.correct .l{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.q.is-ok{border-left:4px solid var(--good)}
.q.is-ko{border-left:4px solid var(--bad)}
.q.is-na{border-left:4px solid var(--warn)}
.fb{margin:12px 0 4px 42px;padding:14px 16px;border-radius:10px;background:var(--bg);font-size:15px}
.fb .status{font-weight:700;margin-bottom:6px}
.fb .status.ok{color:var(--good)} .fb .status.ko{color:var(--bad)} .fb .status.na{color:var(--warn)}
.fb blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);font-family:"Source Serif 4",Georgia,serif;font-style:italic}
.fb ul{margin:6px 0;padding-left:18px}
.fb .tip{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.fb .see{margin-top:8px;border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}

.footer-submit{display:flex;justify-content:center;margin:40px 0 60px}

/* Paged mode (TCF): one question per screen, like the computer-based test */
body.paged:not(.graded) .q{display:none}
body.paged:not(.graded) .q.cur{display:block}
body.paged:not(.graded) .q-text{font-size:18px}
.qnav{max-width:820px;margin:18px auto 60px}
.qnav-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qpos{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.4;cursor:default}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pal{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600}
.pal.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.pal.now{outline:2px solid var(--accent);outline-offset:1px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:16px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal p{margin:0 0 18px;color:var(--muted)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:860px){
  .ex-grid{grid-template-columns:1fr}
  .doc{position:static;max-height:none;padding:22px 18px;font-size:17px}
  .opts,.fb{margin-left:0}
  .facts{grid-template-columns:1fr}
  .cover{padding:24px 18px;margin:20px auto}
  .cover h1{font-size:28px}
  .score{font-size:52px}
}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <div class="spacer"></div>
    <span id="progress" class="chip hidden"></span>
    <span id="timer" class="chip hidden" aria-live="polite"></span>
    <button id="submitTop" class="btn hidden">Remettre ma copie</button>
    <button id="themeBtn" class="icon-btn" title="Changer de thème" aria-label="Changer de thème">◐</button>
  </div>
</header>

<main class="wrap">

  <section id="results" class="results hidden" aria-live="polite"></section>

    <div class="footer-submit" id="footerSubmit"><button id="submitBottom" class="btn">Remettre ma copie</button></div>
  </div>
</main>

<div id="modal" class="modal-bg hidden" role="dialog" aria-modal="true" aria-labelledby="mTitle">

    <h3 id="mTitle">Remettre votre copie ?</h3>

      <button id="mOk" class="btn">Oui, remettre ma copie</button>
    </div>
  </div>
</div>

<script>
const EXAM = {"level":"B2","epreuve":"Compréhension des écrits","sujet":1,"durationMin":60,"storeKey":"delf-b2-ce-sujet01","exercises":[{"kind":"Article de presse","theme":"Urbanisme et mobilité — les rues scolaires fermées à la circulation","points":9,"consigne":"Lisez le document puis répondez aux questions en choisissant la bonne réponse.","document":"\n        <h3 class=\"doc-title\">Rues scolaires : quand la voiture cède le passage aux cartables</h3>\n        <p class=\"chapo\"><span class=\"ev\" data-q=\"1\">Depuis trois ans, de plus en plus de communes interdisent la circulation, aux heures d'entrée et de sortie des classes, dans les rues qui bordent les écoles.</span> <span class=\"ev\" data-q=\"1\">Plébiscité par les familles, le dispositif séduit, mais son efficacité réelle divise encore les spécialistes.</span></p>\n        <p>À Grenoble, il est 8 h 20 rue des Glycines, et deux barrières métalliques viennent de fermer la chaussée devant l'école élémentaire du quartier. Pendant quarante minutes, aucune voiture ne passera : les élèves arrivent à pied, à vélo ou à trottinette, sous l'œil de deux parents bénévoles. « Avant, c'était un ballet de voitures en double file, se souvient Nadia Ferrand, mère d'élève. <span class=\"ev\" data-q=\"2\">Aujourd'hui, mon fils de neuf ans fait le trajet tout seul, et je ne m'inquiète plus.</span> »</p>\n        <p>Grenoble est loin d'être un cas isolé. Selon l'Observatoire national des mobilités actives, plus de 1 200 rues scolaires ont vu le jour en France depuis 2023, contre une centaine auparavant. Autour des établissements pilotes, les relevés indiquent une baisse moyenne de 23 % du dioxyde d'azote aux heures de fermeture. Ces chiffres doivent toutefois être lus avec prudence : la baisse ne concerne que les abords immédiats de l'école, et une partie de la circulation se reporte sur les rues voisines.</p>\n        <p>Deux modèles coexistent. Le premier, de loin le plus répandu, consiste à fermer la rue de manière temporaire, grâce à des barrières amovibles installées matin et soir. Le second, plus ambitieux, transforme durablement la chaussée : la rue, piétonnisée et plantée d'arbres, devient un véritable lieu de vie. <span class=\"ev\" data-q=\"3\">Ce second modèle coûte nettement plus cher – jusqu'à 300 000 euros par rue –, mais il dispense la commune de mobiliser chaque jour des agents ou des bénévoles.</span></p>\n        <p>Pour Julien Marchetti, urbaniste et chercheur au laboratoire Villes et Territoires, l'essentiel est ailleurs. « <span class=\"ev\" data-q=\"4\">La rue scolaire n'est pas d'abord une mesure antipollution. Elle change la manière dont les enfants s'approprient la ville</span> : un enfant qui marche seul jusqu'à l'école gagne en autonomie. » Le chercheur met néanmoins en garde : « <span class=\"ev\" data-q=\"4\">Si la mesure reste isolée, elle risque de n'être qu'un symbole. Sans trottoirs sûrs ni pistes cyclables pour rejoindre l'école, on ne fait que déplacer le problème de cent mètres.</span> »</p>\n        <p>Le dispositif a aussi ses détracteurs. Certains commerçants dénoncent une baisse de fréquentation, sans qu'aucune étude ne l'ait confirmée à ce jour. Des parents qui travaillent loin jugent, eux, qu'on leur complique la vie. <span class=\"ev\" data-q=\"5\">Surtout, les écoles situées sur un axe de bus ou une route départementale ne peuvent tout simplement pas en bénéficier.</span></p>\n        <p>Du côté de l'État, on se garde bien de légiférer. <span class=\"ev\" data-q=\"6\">Le ministère des Transports estime que la décision relève des maires, « qui connaissent le terrain », et se contente de leur fournir un guide méthodologique.</span> Une proposition de loi visant à les rendre obligatoires devant les écoles neuves a bien été déposée au printemps, <span class=\"ev\" data-q=\"6\">mais elle n'a toujours pas été inscrite à l'ordre du jour.</span></p>\n      ","source":"Texte rédigé pour l'entraînement. Personnes, laboratoire et observatoire fictifs.","questions":[{"id":1,"q":"Quel est le sujet principal de cet article ?","o":["La réussite d'une école grenobloise qui a supprimé la circulation devant ses portes.","Un dispositif en pleine expansion, apprécié des familles, mais dont les effets restent débattus.","La mobilisation des parents d'élèves pour obtenir l'interdiction des voitures en ville."],"a":1,"quote":"« Depuis trois ans, de plus en plus de communes interdisent la circulation […] dans les rues qui bordent les écoles. Plébiscité par les familles, le dispositif séduit, mais son efficacité réelle divise encore les spécialistes. »","why":"Le chapô résume toujours l'article. Il annonce deux idées : un phénomène qui se développe (« de plus en plus de communes ») et un débat (« mais son efficacité réelle divise »). La réponse B reformule ces deux éléments : « en pleine expansion » = « de plus en plus », « apprécié des familles » = « plébiscité par les familles », « débattus » = « divise les spécialistes ».","wrong":["A : <b>piège</b> classique : l'exemple d'ouverture (Grenoble) n'est qu'une illustration. Le journaliste écrit d'ailleurs : « Grenoble est loin d'être un cas isolé. »","C : exagération et information absente : l'article parle des rues situées devant les écoles, aux heures d'entrée et de sortie, et non d'une interdiction des voitures dans toute la ville ; aucune mobilisation de parents n'est décrite."],"tip":"Pour l'idée générale, lisez d'abord le titre et le chapô, puis vérifiez avec le dernier paragraphe. Méfiez-vous de l'anecdote du premier paragraphe : dans un article de presse, elle sert d'« accroche », elle n'est pas le sujet."},{"id":2,"q":"Selon Nadia Ferrand, qu'est-ce qui a changé depuis la création de la rue scolaire ?","o":["Des agents municipaux accompagnent désormais les enfants jusqu'à l'école.","La rue des Glycines est maintenant interdite aux voitures toute la journée.","Certains élèves, comme son fils, peuvent aller à l'école sans être accompagnés."],"a":2,"quote":"« Aujourd'hui, mon fils de neuf ans fait le trajet tout seul, et je ne m'inquiète plus. »","why":"« Faire le trajet tout seul » = aller à l'école sans adulte, « sans être accompagné ». L'adverbe « Aujourd'hui » s'oppose à « Avant » : c'est bien un changement.","wrong":["A : mauvais détail : ce sont « deux parents bénévoles » qui surveillent la rue, pas des agents municipaux ; et ils ne raccompagnent pas les enfants.","B : contradiction : la rue n'est fermée que « pendant quarante minutes », aux heures d'entrée des classes."],"tip":"Dans une question de détail, vérifiez chaque mot de l'option : la personne (parents ou agents ?), la durée (quarante minutes ou toute la journée ?). Une seule erreur suffit à éliminer une réponse."},{"id":3,"q":"Qu'est-ce qui caractérise « ce second modèle » ?","o":["Il demande un investissement plus important, mais évite une surveillance quotidienne.","Il repose sur des barrières que l'on installe chaque matin et chaque soir.","Il est aujourd'hui le modèle le plus répandu dans les communes françaises."],"a":0,"quote":"« Ce second modèle coûte nettement plus cher – jusqu'à 300 000 euros par rue –, mais il dispense la commune de mobiliser chaque jour des agents ou des bénévoles. »","why":"« Coûter nettement plus cher » = « demander un investissement plus important ». « Dispenser de mobiliser chaque jour des agents » = ne plus avoir besoin de personnes pour surveiller tous les jours. Le connecteur « mais » oppose l'inconvénient (le coût) à l'avantage.","wrong":["B : <b>piège</b> de la reprise : les barrières « installées matin et soir » caractérisent le <b>premier</b> modèle, la fermeture temporaire.","C : contradiction : c'est le premier modèle qui est « de loin le plus répandu ». Le second est présenté comme « plus ambitieux »."],"tip":"Quand le texte oppose « le premier… le second… », soulignez ce qui appartient à chacun. Les expressions de reprise (« ce second modèle », « ce dernier », « celui-ci ») renvoient à un élément précis : remontez toujours dans le texte pour l'identifier."},{"id":4,"q":"Quelle est l'opinion de Julien Marchetti sur les rues scolaires ?","o":["Elles sont avant tout un moyen efficace de lutter contre la pollution de l'air.","Elles sont inutiles tant que les villes ne disposent pas de pistes cyclables.","Leur intérêt principal ne tient pas à la qualité de l'air, mais elles doivent s'inscrire dans un projet plus large."],"a":2,"quote":"« La rue scolaire n'est pas d'abord une mesure antipollution. Elle change la manière dont les enfants s'approprient la ville […]. Si la mesure reste isolée, elle risque de n'être qu'un symbole. »","why":"L'urbaniste dit que l'essentiel est ailleurs que dans la pollution : c'est l'autonomie des enfants. Puis il nuance (« néanmoins ») : isolée, la mesure risque de n'être « qu'un symbole ». Il faut donc l'accompagner d'autres aménagements (trottoirs, pistes cyclables) : c'est le « projet plus large » de la réponse C.","wrong":["A : contradiction directe : « La rue scolaire n'est <b>pas d'abord</b> une mesure antipollution. »","B : <b>piège</b> de l'exagération : l'expert dit que la mesure isolée est <b>insuffisante</b> (« elle risque de n'être qu'un symbole »), pas qu'elle est inutile. Insuffisant ≠ inutile."],"tip":"Quand un expert donne une opinion en deux temps (un avis + « néanmoins / toutefois » + une mise en garde), la bonne réponse contient souvent les deux. Méfiez-vous des options radicales (« inutile », « jamais », « totalement »)."},{"id":5,"q":"Quelle limite du dispositif l'article présente-t-il comme établie ?","o":["Il a fait baisser de manière mesurable le chiffre d'affaires des commerces voisins.","Il ne peut pas être mis en place devant toutes les écoles.","Il est de plus en plus rejeté par l'ensemble des parents d'élèves."],"a":1,"quote":"« Surtout, les écoles situées sur un axe de bus ou une route départementale ne peuvent tout simplement pas en bénéficier »","why":"« Ne pas pouvoir en bénéficier » = le dispositif ne peut pas être installé devant ces écoles. L'adverbe « Surtout » signale que c'est la limite la plus importante, et le journaliste la présente comme un fait (« tout simplement »), sans réserve.","wrong":["A : <b>piège</b> de l'idée non confirmée : les commerçants « dénoncent » une baisse, « sans qu'aucune étude ne l'ait confirmée ». Ce n'est donc pas une limite établie.","C : contradiction et exagération : le dispositif est « plébiscité par les familles » ; seuls « des parents qui travaillent loin » le critiquent, pas « l'ensemble des parents »."],"tip":"Distinguez ce que le texte présente comme un fait et ce qui n'est qu'une opinion ou une accusation : « dénoncer », « estimer », « sans que cela soit confirmé » signalent un point de vue, pas une vérité établie."},{"id":6,"q":"Quelle est la position de l'État sur les rues scolaires ?","o":["Il laisse les communes décider, tout en mettant à leur disposition des conseils.","Il vient de voter une loi qui les rend obligatoires devant les nouvelles écoles.","Il finance la transformation des rues scolaires en espaces aménagés durablement."],"a":0,"quote":"« Le ministère des Transports estime que la décision relève des maires, « qui connaissent le terrain », et se contente de leur fournir un guide méthodologique. »","why":"« La décision relève des maires » = ce sont les communes qui décident. « Fournir un guide méthodologique » = donner des conseils pratiques. L'expression « se garder bien de légiférer » montre que l'État refuse volontairement de faire une loi.","wrong":["B : <b>piège</b> : une proposition de loi a été « déposée », mais elle « n'a toujours pas été inscrite à l'ordre du jour ». Elle n'a donc pas été votée.","C : information absente : l'article ne parle d'aucun financement de l'État."],"tip":"Attention au vocabulaire politique : une loi « déposée » ou « proposée » n'est pas une loi « adoptée » ou « votée ». Repérez aussi « se contenter de » : il indique une action limitée, minimale."}]},{"kind":"Entretien","theme":"Science et recherche — les sciences participatives et les citoyens observateurs","points":9,"consigne":"Lisez le document puis répondez aux questions en choisissant la bonne réponse.","document":"\n        <h3 class=\"doc-title\">« Les volontaires ne remplacent pas les chercheurs : ils leur prêtent des yeux partout »</h3>\n        <p class=\"chapo\">Compter les papillons, photographier les insectes d'une haie : les programmes de sciences participatives attirent chaque année davantage de bénévoles. Hélène Vasseur, écologue à l'Institut ligérien de la biodiversité, à Tours, coordonne l'un d'eux depuis 2019.</p>\n        <p class=\"itw-q\">Que recouvre exactement l'expression « sciences participatives » ?</p>\n        <p><span class=\"ev\" data-q=\"7\">C'est une façon de faire de la recherche dans laquelle des non-spécialistes recueillent des données selon un protocole défini par des scientifiques.</span> Le mot essentiel, c'est « protocole » : <span class=\"ev\" data-q=\"7\">il ne s'agit pas de partager de jolies photos sur les réseaux sociaux, mais de suivre une méthode précise, toujours la même</span>, pour que les observations soient comparables d'une année sur l'autre.</p>\n        <p class=\"itw-q\">Votre programme a-t-il du succès ?</p>\n        <p>Nous sommes passés de 300 participants la première année à près de 4 000 aujourd'hui. <span class=\"ev\" data-q=\"8\">Mais le chiffre qui compte le plus à mes yeux est un autre : environ un tiers des volontaires nous envoient des données depuis plus de trois ans.</span> C'est ce noyau fidèle qui fait la valeur scientifique du programme, car une série longue vaut bien davantage que des milliers d'observations ponctuelles.</p>\n        <p class=\"itw-q\">Qu'avez-vous appris grâce à ces données ?</p>\n        <p>Nous avons montré que les haies taillées en fin d'hiver accueillaient deux fois plus d'insectes pollinisateurs que celles taillées à l'automne. Aucune équipe n'aurait pu couvrir seule un territoire aussi vaste : il aurait fallu des dizaines de techniciens. <span class=\"ev\" data-q=\"9\">Ces résultats ont d'ailleurs conduit plusieurs communes à revoir leur calendrier d'entretien des haies.</span></p>\n        <p class=\"itw-q\">Certains chercheurs doutent de la fiabilité des données d'amateurs…</p>\n        <p><span class=\"ev\" data-q=\"10\">Je trouve cette inquiétude légitime : un volontaire peut confondre deux espèces, oublier une sortie ou n'observer que par beau temps. Mais elle repose souvent sur une image dépassée.</span> Nous formons les participants, nous vérifions les photos douteuses, et les erreurs individuelles se compensent sur un grand nombre d'observations. <span class=\"ev\" data-q=\"10\">Les amateurs ne sont pas moins fiables ; ils se trompent autrement, et nous savons corriger ces biais.</span></p>\n        <p class=\"itw-q\">Comment entretenir la motivation des bénévoles sur la durée ?</p>\n        <p>Il y a une règle sur laquelle nous ne transigeons jamais : <span class=\"ev\" data-q=\"11\">rendre aux participants ce qu'ils nous donnent. Chaque hiver, nous leur envoyons les résultats de l'année</span> et nous organisons des rencontres avec les chercheurs. <span class=\"ev\" data-q=\"11\">Un volontaire qui ignore à quoi servent ses données finit toujours par abandonner.</span></p>\n        <p class=\"itw-q\">Quel est aujourd'hui votre principal défi ?</p>\n        <p><span class=\"ev\" data-q=\"12\">Paradoxalement, ce n'est plus le recrutement. Le vrai défi, c'est la diversité des participants : nos volontaires sont surtout des retraités et des diplômés, souvent issus de milieux aisés.</span> Pour que la science soit vraiment partagée, <span class=\"ev\" data-q=\"12\">il faut aller chercher les jeunes, les habitants des quartiers populaires.</span></p>\n      ","source":"Entretien rédigé pour l'entraînement. Personne, institut et programme fictifs.","questions":[{"id":7,"q":"Comment Hélène Vasseur définit-elle les sciences participatives ?","o":["Des amateurs partagent librement leurs photos de la nature sur les réseaux sociaux.","Des chercheurs présentent régulièrement leurs travaux au grand public.","Des non-spécialistes collectent des données en respectant une méthode fixée par des chercheurs."],"a":2,"quote":"« C'est une façon de faire de la recherche dans laquelle des non-spécialistes recueillent des données selon un protocole défini par des scientifiques. »","why":"La réponse C reformule la définition mot à mot : « recueillir » = « collecter », « un protocole défini par des scientifiques » = « une méthode fixée par des chercheurs ». L'interviewée insiste elle-même sur ce mot : « Le mot essentiel, c'est “protocole” ».","wrong":["A : <b>piège</b> : l'option reprend les mots du texte (« photos », « réseaux sociaux »), mais pour dire le contraire : « il ne s'agit <b>pas</b> de partager de jolies photos sur les réseaux sociaux ».","B : inversion des rôles : dans les sciences participatives, ce sont les citoyens qui participent à la recherche ; il ne s'agit pas de vulgarisation scientifique."],"tip":"La structure « il ne s'agit pas de X, mais de Y » est très fréquente dans les définitions : X est le contresens à éviter, Y est la vraie définition. Les distracteurs reprennent souvent X."},{"id":8,"q":"Quel chiffre Hélène Vasseur juge-t-elle le plus révélateur de la réussite du programme ?","o":["La proportion de volontaires qui participent depuis plusieurs années.","Le nombre total de participants, qui a été multiplié par plus de dix.","Le nombre d'observations envoyées chaque année par les bénévoles."],"a":0,"quote":"« Mais le chiffre qui compte le plus à mes yeux est un autre : environ un tiers des volontaires nous envoient des données depuis plus de trois ans. »","why":"« Un tiers des volontaires […] depuis plus de trois ans » = la proportion de bénévoles fidèles, engagés « depuis plusieurs années ». Elle explique pourquoi : « une série longue vaut bien davantage que des milliers d'observations ponctuelles ».","wrong":["B : <b>piège</b> : le passage de 300 à 4 000 participants est bien dans le texte, mais le connecteur « Mais » et l'expression « est un autre » montrent que ce n'est <b>pas</b> le chiffre le plus important pour elle.","C : information absente : aucun nombre d'observations annuelles n'est donné ; elle relativise même les « milliers d'observations ponctuelles »."],"tip":"Quand une personne cite plusieurs chiffres, cherchez celui qu'elle met en valeur : « le chiffre qui compte », « surtout », « ce qui me frappe ». Un « mais » placé après un premier chiffre annonce souvent l'information principale."},{"id":9,"q":"Quelle conséquence concrète les résultats du programme ont-ils eue ?","o":["Les communes ont recruté des techniciens pour surveiller les haies.","Certaines communes ont changé la période à laquelle elles taillent les haies.","Les volontaires ont été invités à planter de nouvelles haies dans la région."],"a":1,"quote":"« Ces résultats ont d'ailleurs conduit plusieurs communes à revoir leur calendrier d'entretien des haies. »","why":"« Conduire à » exprime la conséquence. « Revoir leur calendrier d'entretien » = changer la période de taille : puisque les haies taillées en fin d'hiver accueillent plus de pollinisateurs, les communes ont modifié la date de leurs travaux.","wrong":["A : <b>piège</b> de l'hypothèse : les « dizaines de techniciens » sont au conditionnel passé (« il aurait fallu ») ; c'est ce qui aurait été nécessaire <b>sans</b> les volontaires, pas ce qui s'est passé.","C : information absente : l'entretien ne parle pas de plantation de haies."],"tip":"Le conditionnel passé (« il aurait fallu », « aucune équipe n'aurait pu ») décrit une situation imaginaire, qui ne s'est pas réalisée. Ne confondez jamais une hypothèse avec un fait."},{"id":10,"q":"Comment Hélène Vasseur réagit-elle aux doutes sur la fiabilité des données ?","o":["Elle estime que ces doutes n'ont absolument aucun fondement.","Elle reconnaît que des erreurs existent, mais affirme qu'elles peuvent être maîtrisées.","Elle admet que les amateurs sont moins fiables que les chercheurs professionnels."],"a":1,"quote":"« Je trouve cette inquiétude légitime […]. Mais elle repose souvent sur une image dépassée. […] Les amateurs ne sont pas moins fiables ; ils se trompent autrement, et nous savons corriger ces biais. »","why":"C'est un <b>accord partiel</b> : elle commence par une concession (« Je trouve cette inquiétude légitime » et elle cite des erreurs possibles), puis « Mais » introduit son objection. « Nous savons corriger ces biais » = les erreurs « peuvent être maîtrisées ».","wrong":["A : exagération : elle juge au contraire l'inquiétude « légitime » ; elle dit seulement qu'elle repose « souvent » sur une image dépassée.","C : contradiction : « Les amateurs <b>ne sont pas moins fiables</b> ». Le <b>piège</b> consiste à confondre la concession (ils font des erreurs) et la conclusion."],"tip":"Face à une critique, repérez la structure « concession + opposition » : « Je trouve cela légitime / C'est vrai / Certes… mais… ». La position réelle de la personne se trouve après le « mais », sans effacer ce qu'elle a concédé avant."},{"id":11,"q":"Quel principe permet, selon elle, de garder les bénévoles motivés ?","o":["Rémunérer les participants qui envoient le plus d'observations.","Limiter les sorties d'observation aux journées de beau temps.","Tenir les volontaires informés de l'utilisation de leurs données."],"a":2,"quote":"« rendre aux participants ce qu'ils nous donnent. Chaque hiver, nous leur envoyons les résultats de l'année […]. Un volontaire qui ignore à quoi servent ses données finit toujours par abandonner. »","why":"« Rendre aux participants ce qu'ils nous donnent » est expliqué par la phrase suivante : on leur envoie les résultats. La dernière phrase donne la raison, sous forme négative : sans savoir « à quoi servent ses données », un volontaire abandonne. Il faut donc l'informer.","wrong":["A : information absente : il n'est jamais question d'argent. « Rendre » ne signifie pas ici « payer », mais partager les résultats.","B : mauvais détail : « n'observer que par beau temps » est cité plus haut comme une <b>erreur</b> possible des amateurs, pas comme une règle."],"tip":"Une expression imagée ou abstraite (« rendre ce qu'on nous donne ») est presque toujours expliquée par la phrase qui suit. Lisez-la avant de choisir : c'est elle qui donne le sens précis."},{"id":12,"q":"Quel est, pour Hélène Vasseur, le principal défi aujourd'hui ?","o":["Élargir le profil social et l'âge des personnes qui participent.","Attirer un nombre beaucoup plus important de nouveaux volontaires.","Former davantage de retraités aux méthodes d'observation scientifique."],"a":0,"quote":"« Paradoxalement, ce n'est plus le recrutement. Le vrai défi, c'est la diversité des participants […] il faut aller chercher les jeunes, les habitants des quartiers populaires »","why":"« La diversité des participants » = des profils plus variés. Les volontaires actuels sont « des retraités et des diplômés […] issus de milieux aisés » ; il faut attirer « les jeunes » (l'âge) et « les habitants des quartiers populaires » (le milieu social).","wrong":["B : <b>piège</b> de l'idée réfutée : « ce n'est plus le recrutement ». Le problème n'est pas le nombre, mais le profil des volontaires.","C : contresens : les retraités sont déjà majoritaires ; elle veut justement attirer d'<b>autres</b> publics."],"tip":"« Paradoxalement » annonce une idée contraire à ce que l'on attend. Et « ce n'est plus X, le vrai défi c'est Y » : X est éliminé, seul Y est la bonne réponse."}]},{"kind":"Texte argumentatif (tribune)","theme":"Tourisme — surtourisme et limitation du nombre de visiteurs","points":7,"consigne":"Lisez le document puis répondez aux questions en choisissant la bonne réponse.","document":"\n        <h3 class=\"doc-title\">Surtourisme : osons limiter l'accès pour mieux accueillir</h3>\n        <p>Chaque été, le même scénario se répète. Sur les sentiers côtiers, dans les villages perchés ou les ruelles des centres historiques, des foules compactes piétinent les lieux qu'elles sont venues admirer. <span class=\"ev\" data-q=\"13\">On entend souvent qu'il serait impossible, voire indécent, de restreindre l'accès à un site naturel ou historique. Je soutiens l'inverse : instaurer des quotas de visiteurs dans les sites saturés n'est pas une atteinte à la liberté de voyager, c'est la seule manière de préserver ce qui rend ces lieux désirables.</span></p>\n        <p>D'abord, la fréquentation excessive abîme concrètement les milieux. <span class=\"ev\" data-q=\"14\">Dans une crique de la côte bretonne que je connais depuis l'enfance, le nombre de visiteurs quotidiens est passé de 400 à plus de 3 000 en quinze ans ; la végétation des dunes, piétinée, y a reculé de moitié.</span> Les panneaux invitant à « rester sur les chemins » n'y changent rien : quand la foule déborde, le sentier s'élargit de lui-même.</p>\n        <p>Ensuite, le surtourisme finit par se retourner contre le tourisme lui-même. <span class=\"ev\" data-q=\"15\">À force d'attirer toujours plus de monde, certaines destinations tuent la poule aux œufs d'or</span> : les visiteurs, lassés de faire la queue et de photographier la nuque de leurs voisins, ne reviennent pas. <span class=\"ev\" data-q=\"16\">Quant aux habitants, chassés par la flambée des loyers et la transformation des logements en meublés touristiques, ils désertent les centres-villes.</span> Or un lieu sans habitants n'est plus qu'un décor.</p>\n        <p>Je ne plaide pas pour un tourisme réservé à une élite. Un quota mal conçu, payant et accessible aux seuls voyageurs capables de planifier leurs vacances six mois à l'avance, ne ferait que remplacer l'encombrement par l'exclusion. Je ne crois pas davantage aux « chartes du visiteur responsable » distribuées à l'entrée des sites : <span class=\"ev\" data-q=\"17\">faute de mesures contraignantes, elles servent surtout d'alibi à des collectivités qui ne veulent rien changer.</span></p>\n        <p>Des solutions justes existent pourtant. <span class=\"ev\" data-q=\"18\">À Port-Lavrec, petite commune du littoral, la réservation gratuite est devenue obligatoire pour accéder au sentier des falaises, et un tiers des places est attribué le jour même, sur place. Résultat : la fréquentation a baissé d'un quart, mais les commerçants n'ont constaté aucune perte</span>, car les visiteurs, moins pressés, restent plus longtemps et dépensent davantage.</p>\n        <p><span class=\"ev\" data-q=\"19\">Élus, cessez de mesurer le succès d'une saison au seul nombre d'entrées. Fixez des seuils, gardez des places pour ceux qui n'ont rien prévu, consacrez les recettes à l'entretien des sites.</span> Et nous, voyageurs, acceptons d'attendre notre tour : <span class=\"ev\" data-q=\"19\">un lieu qui sait parfois nous dire « non » est un lieu qui a encore quelque chose à nous offrir.</span></p>\n      ","source":"Tribune rédigée pour l'entraînement. Lieux, personnes et chiffres fictifs.","questions":[{"id":13,"q":"Quelle est la thèse défendue par l'auteur ?","o":["Les sites les plus fragiles devraient être définitivement fermés aux touristes.","Limiter le nombre de visiteurs est le meilleur moyen de protéger les sites très fréquentés.","Il serait inacceptable de restreindre l'accès à un site naturel ou historique."],"a":1,"quote":"« Je soutiens l'inverse : instaurer des quotas de visiteurs dans les sites saturés n'est pas une atteinte à la liberté de voyager, c'est la seule manière de préserver ce qui rend ces lieux désirables. »","why":"La thèse est annoncée par « Je soutiens ». « Instaurer des quotas de visiteurs » = limiter le nombre de visiteurs ; « préserver ce qui rend ces lieux désirables » = protéger les sites ; « les sites saturés » = les sites très fréquentés.","wrong":["A : exagération : l'auteur ne veut pas fermer les sites, mais en limiter l'accès. Sa conclusion dit même qu'un lieu qui dit « parfois » non a encore « quelque chose à nous offrir ».","C : <b>piège</b> de l'idée réfutée : c'est l'opinion que l'auteur rapporte (« On entend souvent qu'il serait impossible, voire indécent… ») pour la contredire aussitôt (« Je soutiens l'inverse »)."],"tip":"Dans une tribune, l'introduction présente souvent une idée reçue (« on dit souvent », « beaucoup pensent ») avant la thèse de l'auteur (« je soutiens », « je crois au contraire »). Ne confondez pas les deux."},{"id":14,"q":"Que montre l'exemple de la crique bretonne ?","o":["L'augmentation de la fréquentation y a entraîné une dégradation du milieu naturel.","Le nombre de visiteurs quotidiens y a été divisé par deux en quinze ans.","La végétation des dunes y a complètement disparu à cause du piétinement."],"a":0,"quote":"« le nombre de visiteurs quotidiens est passé de 400 à plus de 3 000 en quinze ans ; la végétation des dunes, piétinée, y a reculé de moitié. »","why":"L'exemple illustre l'argument annoncé juste avant : « la fréquentation excessive abîme concrètement les milieux ». La hausse des visiteurs (de 400 à plus de 3 000) a pour conséquence le recul de la végétation : c'est une « dégradation du milieu naturel ».","wrong":["B : <b>piège</b> du chiffre déplacé : « de moitié » concerne la végétation, pas les visiteurs, dont le nombre a au contraire fortement augmenté.","C : exagération : la végétation a « reculé de moitié », elle n'a pas « complètement disparu »."],"tip":"Pour une question sur un chiffre, associez chaque nombre à ce qu'il mesure (les visiteurs ? la végétation ?) et au sens de l'évolution (hausse ou baisse ?). Les distracteurs mélangent souvent ces éléments."},{"id":15,"q":"Dans ce texte, « tuer la poule aux œufs d'or » signifie :","o":["attirer de nouveaux visiteurs grâce à une publicité plus efficace.","renoncer volontairement à une partie de ses revenus pour protéger un site.","détruire, par excès, ce qui était à l'origine de sa richesse."],"a":2,"quote":"« À force d'attirer toujours plus de monde, certaines destinations tuent la poule aux œufs d'or : les visiteurs […] ne reviennent pas. »","why":"La poule aux œufs d'or représente une source de richesse ; la « tuer », c'est la détruire en voulant en profiter trop vite. Le contexte le confirme : « à force d'attirer toujours plus de monde » (l'excès), les destinations perdent leurs visiteurs, donc ce qui les faisait vivre.","wrong":["A : contresens : l'expression décrit une perte, pas une attraction de nouveaux visiteurs.","B : <b>piège</b> : il y a bien une perte de revenus, mais elle n'est pas « volontaire » ; elle est la conséquence involontaire de l'excès. Renoncer volontairement correspond plutôt à la proposition de l'auteur (les quotas)."],"tip":"Pour comprendre une expression idiomatique, ne la traduisez pas mot à mot : regardez ce qui l'entoure. Ici, « à force de » (la cause) et les deux-points (la conséquence) expliquent l'image."},{"id":16,"q":"Selon l'auteur, quelle conséquence le surtourisme a-t-il pour les habitants ?","o":["Ils sont poussés à quitter les centres-villes à cause du coût du logement.","Ils transforment leurs logements en meublés touristiques pour s'enrichir.","Ils refusent désormais d'accueillir les touristes dans leur quartier."],"a":0,"quote":"« Quant aux habitants, chassés par la flambée des loyers et la transformation des logements en meublés touristiques, ils désertent les centres-villes. »","why":"« Chassés par la flambée des loyers » = poussés à partir parce que les loyers augmentent fortement (« le coût du logement ») ; « déserter les centres-villes » = les quitter.","wrong":["B : <b>piège</b> de l'inversion : la transformation en meublés touristiques est une <b>cause</b> du départ des habitants, pas une action des habitants eux-mêmes.","C : information absente : l'auteur ne parle d'aucun refus des habitants."],"tip":"Repérez qui fait quoi : dans une construction passive (« chassés par… »), le complément introduit par « par » est la cause ou l'agent, et le sujet (les habitants) subit l'action."},{"id":17,"q":"Les chartes « servent surtout d'alibi » aux collectivités. Cela veut dire qu'elles :","o":["prouvent que les collectivités agissent efficacement contre le surtourisme.","permettent aux collectivités de donner l'impression d'agir sans rien changer.","obligent légalement les visiteurs à respecter les sites qu'ils fréquentent."],"a":1,"quote":"« faute de mesures contraignantes, elles servent surtout d'alibi à des collectivités qui ne veulent rien changer. »","why":"Un alibi est, au sens propre, une preuve d'innocence ; au sens figuré, « servir d'alibi », c'est servir de prétexte, de justification. Les chartes permettent aux collectivités de montrer qu'elles font « quelque chose » alors qu'elles « ne veulent rien changer ».","wrong":["A : contresens : l'auteur critique les chartes (« Je ne crois pas davantage aux chartes ») ; il ne les juge pas efficaces.","C : contradiction : « faute de mesures contraignantes » = justement, les chartes n'obligent à rien."],"tip":"Les expressions « servir d'alibi », « servir de prétexte », « se donner bonne conscience », « un effet d'annonce » expriment toutes la même critique : une action qui sert à paraître, pas à agir."},{"id":18,"q":"Pourquoi l'auteur cite-t-il l'exemple de Port-Lavrec ?","o":["Pour montrer que les quotas finissent par ruiner l'économie locale.","Pour prouver qu'une réservation payante est la solution la plus efficace.","Pour montrer qu'une limitation peut rester ouverte à tous sans nuire aux commerces."],"a":2,"quote":"« la réservation gratuite est devenue obligatoire […] et un tiers des places est attribué le jour même, sur place. Résultat : la fréquentation a baissé d'un quart, mais les commerçants n'ont constaté aucune perte »","why":"L'exemple suit la phrase « Des solutions justes existent pourtant ». Il répond aux deux craintes de la concession : l'exclusion (ici, la réservation est « gratuite » et des places sont gardées pour ceux qui n'ont pas réservé, donc « ouverte à tous ») et la perte économique (« aucune perte »).","wrong":["A : contradiction : « les commerçants n'ont constaté aucune perte ».","B : mauvais détail : la réservation est « gratuite ». L'auteur critique justement plus haut les quotas « payants »."],"tip":"Pour comprendre la fonction d'un exemple, regardez la phrase qui l'introduit (« Des solutions justes existent pourtant ») : l'exemple sert à la prouver. Mettez-le aussi en relation avec la concession qui précède."},{"id":19,"q":"Quel est le ton général de cette tribune ?","o":["Neutre et descriptif : l'auteur se contente d'exposer des faits.","Engagé mais nuancé : l'auteur défend une position et propose des solutions.","Alarmiste et résigné : l'auteur pense qu'il est déjà trop tard pour agir."],"a":1,"quote":"« Élus, cessez de mesurer le succès d'une saison au seul nombre d'entrées. Fixez des seuils, gardez des places pour ceux qui n'ont rien prévu […] »","why":"Le ton est <b>engagé</b> : première personne (« Je soutiens », « Je ne plaide pas »), interpellation directe (« Élus »), impératifs (« cessez », « fixez », « acceptons »). Il est aussi <b>nuancé</b> : l'auteur refuse un tourisme « réservé à une élite » (concession), et il est <b>constructif</b> : il donne un exemple de solution et des propositions concrètes.","wrong":["A : l'auteur ne se contente pas d'exposer : il donne son opinion (« Je soutiens l'inverse ») et donne des ordres aux élus.","C : il décrit des problèmes sérieux, mais il n'est pas résigné : « Des solutions justes existent pourtant », et sa conclusion est même optimiste (« un lieu qui a encore quelque chose à nous offrir »)."],"tip":"Indices d'un ton engagé : le « je », les verbes d'opinion, les impératifs, l'apostrophe (« Élus, … »). Pour distinguer « engagé » de « polémique » ou « alarmiste », cherchez la concession et les propositions : elles montrent un ton nuancé et constructif."}]}]};

let state = { answers: {}, start: null, submitted: false, elapsed: 0 };
let tick = null;

function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }
function load(){ try { return JSON.parse(localStorage.getItem(STORE)); } catch(e){ return null; } }
function clear(){ try { localStorage.removeItem(STORE); } catch(e){} }

/* ---------- Shell (cover + documents) ---------- */

  const letterRule = sameOpts
    ? `(${LETTERS.slice(0, maxOpts - 1).join(', ')} ou ${LETTERS[maxOpts - 1]})`

        const n = Math.max(...e.questions.map(q => q.o.length));
        return `${LETTERS.slice(0, n - 1).join(', ')} ou ${LETTERS[n - 1]} dans l'exercice ${i + 1}`;
      }).join(' ; ')})`;
  const c = EXAM.cover || {};
  const tcfCover = () => `

    <p class="sub">${c.subtitle || `Sujet d'entraînement au format TCF, centré sur le niveau ${EXAM.level} : grammaire, formulation et vocabulaire.`}</p>
    <div class="facts">
      <div class="fact"><b>${dur}</b><span>Durée de l'épreuve</span></div>
      <div class="fact"><b>${TOTAL_Q}</b><span>Questions à choix multiple</span></div>
      <div class="fact"><b>${EXAM.level}</b><span>Niveau visé (difficulté progressive)</span></div>
    </div>
    <div class="consignes">
      <h3>Consignes</h3>
      <ul>
        <li>Pour chaque question, choisissez le mot ou l'expression qui complète correctement la phrase, ou la phrase correcte.</li>
        <li><b>Une seule réponse</b> est correcte ${letterRule}.</li>
        <li>Les questions sont classées par <b>difficulté croissante</b> : ne restez pas bloqué sur une question.</li>
        <li>Les questions s'affichent <b>une par une</b>. La grille sous la question permet de revenir sur une question ; vous pouvez aussi utiliser les touches A, B, C, D et les flèches ← →.</li>
        <li>Une réponse fausse ou absente vaut 0 point : il n'y a <b>pas de points négatifs</b>. Répondez à toutes les questions.</li>
        <li>Le chronomètre démarre dès que vous cliquez sur « Commencer ». À la fin des ${EXAM.durationMin} minutes, la copie est remise automatiquement.</li>
        <li>Dictionnaires et traducteurs interdits — jouez le jeu comme le jour de l'examen !</li>
      </ul>
    </div>
    <div class="prof">« ${c.profQuote || "Vous avez moins d'une minute par question. Lisez toute la phrase avant de regarder les choix : le sujet, le temps, les prépositions et les connecteurs autour du blanc vous donnent la réponse."} » — Votre professeur</div>
    <button id="startBtn" class="btn">Commencer l'épreuve</button>
    <p id="resumeNote" class="note hidden"></p>`;
  $('#cover').innerHTML = IS_TCF ? tcfCover() : `
    <div class="kicker">Diplôme ${LV.diploma === 'DALF' ? 'approfondi' : "d'études"} en langue française · Épreuve blanche · Sujet ${EXAM.sujet}</div>
    <h1>${EXAM.epreuve} — Niveau ${EXAM.level}</h1>
    <p class="sub">${c.subtitle || "Sujet d'entraînement conforme au format QCM actuel de l'examen."}</p>
    <div class="facts">
      <div class="fact"><b>${dur}</b><span>Durée de l'épreuve</span></div>
      <div class="fact"><b>${EXAM.exercises.length}</b><span>Exercices · ${TOTAL_Q} questions</span></div>
      <div class="fact"><b>/${fmt(TOTAL_PTS)}</b><span>Note sur ${fmt(TOTAL_PTS)} points</span></div>
    </div>
    <div class="consignes">
      <h3>Consignes</h3>
      <ul>
        <li>Lisez attentivement chaque document, puis répondez aux questions.</li>

    <button id="startBtn" class="btn">Commencer l'épreuve</button>

  $('#exercises').innerHTML = EXAM.exercises.map((e, i) => `

/* ---------- Questions ---------- */
function renderQuestions(){
  document.querySelectorAll('.questions').forEach(box => {
    const ex = EXAM.exercises[+box.dataset.ex];
    const pts = ex.points / ex.questions.length;
    box.innerHTML = ex.questions.map(q => `
      <div class="q" id="q${q.id}">
        <div class="q-head">
          <span class="q-num">${q.id}</span>
          <p class="q-text">${q.q}</p>
          <span class="q-pts">${fmt(pts)} pt</span>
        </div>
        <div class="opts" role="radiogroup" aria-label="Question ${q.id}">
          ${q.o.map((txt, i) => `
            <label class="opt" data-q="${q.id}" data-i="${i}">
              <input type="radio" name="q${q.id}" value="${i}">
              <span class="l">${LETTERS[i]}</span>
              <span>${txt}</span>
            </label>`).join('')}
        </div>
        <div class="fb hidden"></div>
      </div>`).join('');
  });
  document.querySelectorAll('.opt input').forEach(inp => {
    inp.addEventListener('change', e => {
      if (state.submitted) return;
      const id = +e.target.name.slice(1);
      state.answers[id] = +e.target.value;
      paintSelection(id);
      updateProgress();
      save();
    });
  });
}

function paintSelection(id){
  document.querySelectorAll(`.opt[data-q="${id}"]`).forEach(l => {
    const sel = state.answers[id] === +l.dataset.i;
    l.classList.toggle('sel', sel);
    l.querySelector('input').checked = sel;
  });
}
function updateProgress(){ $('#progress').textContent = `${Object.keys(state.answers).length} / ${TOTAL_Q} réponses`; paintNav(); }

/* ---------- Paged navigation (TCF) ---------- */
let cur = 0;
function renderNav(){
  if (!PAGED) return;
  $('#qnav').innerHTML = `
    <div class="qnav-row">
      <button class="btn ghost" id="prevQ">← Précédente</button>
      <span class="qpos" id="qpos"></span>
      <button class="btn" id="nextQ">Suivante →</button>
    </div>
    <div class="palette" aria-label="Aller à la question">${ALL.map((q, i) => `<button class="pal" data-i="${i}" aria-label="Question ${q.id}">${q.id}</button>`).join('')}</div>
    <p class="note">Raccourcis : touches A, B, C, D pour répondre · flèches ← → pour changer de question.</p>`;
  $('#prevQ').addEventListener('click', () => go(cur - 1));
  $('#nextQ').addEventListener('click', () => cur === TOTAL_Q - 1 ? askSubmit() : go(cur + 1));
  document.querySelectorAll('.pal').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
}
function go(i){
  if (!PAGED || state.submitted) return;
  cur = Math.max(0, Math.min(TOTAL_Q - 1, i));
  state.cur = cur; save();
  document.querySelectorAll('.q').forEach(c => c.classList.toggle('cur', c.id === `q${ALL[cur].id}`));
  paintNav();
  window.scrollTo({ top: 0 });
}
function paintNav(){
  if (!PAGED || !$('#qpos')) return;
  $('#qpos').textContent = `Question ${cur + 1} / ${TOTAL_Q}`;
  $('#prevQ').disabled = cur === 0;
  $('#nextQ').textContent = cur === TOTAL_Q - 1 ? 'Remettre ma copie' : 'Suivante →';
  document.querySelectorAll('.pal').forEach((b, i) => {
    b.classList.toggle('done', state.answers[ALL[i].id] !== undefined);
    b.classList.toggle('now', i === cur);
  });
}

/* ---------- Timer ---------- */
function remaining(){ return Math.max(0, DURATION - Math.floor((Date.now() - state.start) / 1000)); }
function showTime(sec){
  const m = String(Math.floor(sec / 60)).padStart(2, '0'), s = String(sec % 60).padStart(2, '0');
  const t = $('#timer');
  t.textContent = `⏱ ${m}:${s}`;
  const warnAt = Math.min(600, DURATION / 3), dangerAt = Math.min(300, DURATION / 7.5); // 10/5 min, or 5/2 min for a 15-min paper
  t.classList.toggle('warn', sec <= warnAt && sec > dangerAt);
  t.classList.toggle('danger', sec <= dangerAt);
}
function startTimer(){
  clearInterval(tick);
  const step = () => { const r = remaining(); showTime(r); if (r <= 0){ clearInterval(tick); grade(true); } };
  step();
  tick = setInterval(step, 1000);
}

/* ---------- Start ---------- */
function startExam(resume){
  if (!resume){ state = { answers: {}, start: Date.now(), submitted: false, elapsed: 0 }; save(); }
  $('#cover').classList.add('hidden');
  $('#exam').classList.remove('hidden');
  ['#progress', '#timer', '#submitTop'].forEach(s => $(s).classList.remove('hidden'));
  Object.keys(state.answers).forEach(id => paintSelection(+id));
  if (PAGED){
    document.body.classList.add('paged');
    $('#qnav').classList.remove('hidden');
    $('#footerSubmit').classList.add('hidden');
    go(state.cur || 0);
  }
  updateProgress();
  startTimer();
  window.scrollTo({ top: 0 });
}

/* ---------- Submit & grade ---------- */
function askSubmit(){
  const missing = TOTAL_Q - Object.keys(state.answers).length;
  $('#mText').innerHTML = missing
    ? `Attention : <b>${missing} question${missing > 1 ? 's' : ''} sans réponse</b>. Une réponse vide vaut 0 point, alors qu'une réponse au hasard a toujours une chance d'être juste.`
    : `Vous avez répondu aux ${TOTAL_Q} questions. Une fois la copie remise, vous ne pourrez plus modifier vos réponses.`;
  $('#modal').classList.remove('hidden');
  $('#mOk').focus();
}
function closeModal(){ $('#modal').classList.add('hidden'); }

function grade(auto){
  if (!state.submitted){
    state.submitted = true;
    state.elapsed = Math.min(DURATION, Math.floor((Date.now() - state.start) / 1000));
    state.auto = !!auto;
    save();
  }
  clearInterval(tick);
  closeModal();
  document.body.classList.add('graded');
  ['#timer', '#submitTop', '#progress'].forEach(s => $(s).classList.add('hidden'));
  $('#footerSubmit').classList.add('hidden');
  $('#qnav').classList.add('hidden');
  document.querySelectorAll('.q.cur').forEach(c => c.classList.remove('cur'));
  $('#cover').classList.add('hidden');
  $('#exam').classList.remove('hidden');
  document.querySelectorAll('.opt input').forEach(i => i.disabled = true);

  let total = 0; const perEx = EXAM.exercises.map(e => ({ got: 0, max: e.points }));
  const dots = [];

  ALL.forEach(q => {
    const user = state.answers[q.id];
    const ok = user === q.a, na = user === undefined;
    if (ok){ total += q.pts; perEx[q.ex].got += q.pts; }
    dots.push(`<a href="#q${q.id}" class="dot ${na ? 'na' : ok ? 'ok' : 'ko'}" title="Question ${q.id}">${q.id}</a>`);

    const card = $(`#q${q.id}`);
    card.classList.add(na ? 'is-na' : ok ? 'is-ok' : 'is-ko');
    card.querySelectorAll('.opt').forEach(l => {
      const i = +l.dataset.i;
      l.classList.remove('sel');
      if (i === q.a) l.classList.add('correct');
      else if (i === user) l.classList.add('wrong');
      l.querySelector('input').checked = i === user;
    });

    const status = na
      ? `<div class="status na">Sans réponse — bonne réponse : ${LETTERS[q.a]} (0 / ${fmt(q.pts)} pt)</div>`
      : ok
        ? `<div class="status ok">✔ Bonne réponse : ${LETTERS[q.a]} (+${fmt(q.pts)} pt)</div>`
        : `<div class="status ko">✘ Vous avez répondu ${LETTERS[user]} — bonne réponse : ${LETTERS[q.a]} (0 / ${fmt(q.pts)} pt)</div>`;
    const lvlTag = IS_TCF && q.lvl ? `<span class="lvl">Niveau ${q.lvl}</span>` : '';
    const fb = card.querySelector('.fb');
    fb.innerHTML = `${status.replace(/<\/div>$/, lvlTag + '</div>')}
      ${q.quote ? `<blockquote>${q.quote}</blockquote>` : ''}
      <div>${q.why}</div>
      <ul>${q.wrong.map(w => `<li>${w}</li>`).join('')}</ul>
      <div class="tip">💡 <b>Conseil du professeur :</b> ${q.tip}</div>
      ${document.querySelector(`.ev[data-q="${q.id}"]`) ? `<button class="see" data-see="${q.id}">Voir le passage dans le texte</button>` : ''}`;
    fb.classList.remove('hidden');
  });

  document.querySelectorAll('[data-see]').forEach(b => b.addEventListener('click', () => seeInText(+b.dataset.see)));
  renderResults(total, perEx, dots);
  $('#results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function seeInText(id){
  document.querySelectorAll('.ev.hl').forEach(e => e.classList.remove('hl'));
  const spans = document.querySelectorAll(`.ev[data-q="${id}"]`);
  spans.forEach(s => s.classList.add('hl'));
  if (spans[0]) spans[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => spans.forEach(s => s.classList.remove('hl')), 4000);
}

function verdictFor(score){
  const r = score / TOTAL_PTS; // thresholds expressed for /25: 5, 12.5, 18, 22
  if (r < 0.2) return { cls: 'bad', tag: 'Note éliminatoire', title: 'Il faut retravailler les bases de la compréhension.',
    text: "Une note inférieure à 5/25 dans une épreuve est éliminatoire, même si le total est suffisant. Entraînez-vous chaque jour avec des documents courts et apprenez à repérer l'idée principale de chaque paragraphe." };
  if (r < 0.5) return { cls: 'warn', tag: 'Fragile', title: "Vous n'êtes pas éliminé, mais la marge est faible.",
    text: "Vous comprenez une partie des documents, mais les reformulations et les détails vous échappent encore. Relisez les explications ci-dessous : notez chaque piège dans lequel vous êtes tombé." };
  if (r < 0.72) return { cls: 'good', tag: `Niveau ${EXAM.level} en vue`, title: 'Bon travail, vous avez la moyenne sur cette épreuve !',
    text: `Vous saisissez l'essentiel des documents. ${LV.progress}` };
  if (r < 0.88) return { cls: 'good', tag: 'Très bien', title: 'Très bonne compréhension des documents.',
    text: `${LV.master} Les quelques erreurs restantes portent probablement sur des détails : relisez toujours la phrase exacte avant de valider.` };
  return { cls: 'good', tag: 'Excellent', title: 'Excellent ! Vous êtes prêt(e) pour le jour J.',
    text: `Votre compréhension est fine et précise. Vous pouvez commencer à vous entraîner sur des sujets du ${LV.next}.` };
}

/* TCF: per-CEFR-level success; a level is reached when ≥ 60 % of its items (and of every easier level) are right. */
function tcfResults(total, dots, timeNote){
  const stats = CEFR.filter(l => ALL.some(q => q.lvl === l)).map(l => {
    const qs = ALL.filter(q => q.lvl === l);
    return { l, n: qs.length, ok: qs.filter(q => state.answers[q.id] === q.a).length };
  });
  let reached = null;
  for (const s of stats) { if (s.ok / s.n >= 0.6) reached = s.l; else break; }
  const gap = reached ? CEFR.indexOf(EXAM.level) - CEFR.indexOf(reached) : 9;
  const v = gap <= 0
    ? { cls: 'good', tag: `Niveau ${reached} atteint`, title: gap < 0 ? 'Excellent ! Vous dépassez le niveau visé.' : `Bravo, vous maîtrisez les structures du niveau ${EXAM.level} !`,
        text: gap < 0 ? 'Vous réussissez même les questions du niveau supérieur. Entraînez-vous maintenant sur un sujet plus difficile.' : 'Relisez les explications des questions manquées : ce sont souvent les points qui vous feront passer au niveau suivant.' }
    : gap === 1
      ? { cls: 'warn', tag: `Niveau ${reached} consolidé`, title: `Le niveau ${EXAM.level} est en vue, mais pas encore acquis.`,
          text: `Vous maîtrisez les structures du niveau ${reached}. Notez chaque règle expliquée ci-dessous pour les questions de niveau ${EXAM.level} manquées et revoyez-les cette semaine.` }
      : { cls: 'bad', tag: reached ? `Niveau ${reached}` : `En dessous de ${stats[0].l}`, title: 'Il faut consolider les bases avant de viser ce niveau.',
          text: `Commencez par les questions des premiers niveaux : chaque erreur correspond à une règle à revoir (conjugaison, pronoms, prépositions…).` };
  $('#results').innerHTML = `
    <div class="res-top">
      <div class="score">${fmt(total)}<small> / ${fmt(TOTAL_PTS)}</small></div>
      <div class="verdict">
        <span class="tag ${v.cls}">${v.tag}</span>
        <h2>${v.title}</h2>
        <p>${v.text}</p>
      </div>
    </div>
    <div class="breakdown">
      ${stats.map(s => `
        <div class="bd">
          <div class="t">Questions de niveau ${s.l}</div>
          <div class="v">${s.ok} / ${s.n}</div>
          <div class="meter"><i style="width:${(s.ok / s.n) * 100}%"></i></div>
        </div>`).join('')}
    </div>
    <div class="grid-dots" aria-label="Accès rapide aux questions">${dots.join('')}</div>
    <p class="note">${timeNote}<br>
    Rappel : le TCF n'a pas de note de réussite. Chaque épreuve donne un score de 100 à 699 et un niveau du CECRL
    (${['B1', 'B2', 'C1', 'C2'].map(l => `${l} = ${TCF_BANDS[l]}`).join(', ')}), et les questions difficiles rapportent plus de points.
    Ce sujet blanc donne une <b>estimation indicative</b> : un niveau est considéré comme atteint si vous réussissez au moins 60 % de ses questions et de celles des niveaux inférieurs.
    ${reached ? `Estimation : <b>niveau ${reached}</b> (≈ ${TCF_BANDS[reached]} points sur l'échelle TCF).` : ''}</p>
    <div class="res-actions">
      <a class="btn" href="#q1">Lire la correction</a>
      <button class="btn ghost" id="restart">Recommencer l'épreuve</button>
    </div>`;
}

function renderResults(total, perEx, dots){
  if (IS_TCF){
    const nOk = ALL.filter(q => state.answers[q.id] === q.a).length;
    const mins = Math.floor(state.elapsed / 60), secs = state.elapsed % 60;
    tcfResults(total, dots, `${nOk} bonne${nOk > 1 ? 's' : ''} réponse${nOk > 1 ? 's' : ''} sur ${TOTAL_Q} · Temps utilisé : ${mins} min ${String(secs).padStart(2, '0')} s${state.auto ? ' (copie remise automatiquement à la fin du temps)' : ''}.`);
    $('#results').classList.remove('hidden');
    $('#restart').addEventListener('click', restart);
    return;
  }
  const v = verdictFor(total);
  const nOk = ALL.filter(q => state.answers[q.id] === q.a).length;
  const mins = Math.floor(state.elapsed / 60), secs = state.elapsed % 60;
  $('#results').innerHTML = `
    <div class="res-top">
      <div class="score">${fmt(total)}<small> / ${fmt(TOTAL_PTS)}</small></div>
      <div class="verdict">
        <span class="tag ${v.cls}">${v.tag}</span>
        <h2>${v.title}</h2>
        <p>${v.text}</p>
      </div>
    </div>
    <div class="breakdown">
      ${perEx.map((p, i) => `
        <div class="bd">
          <div class="t">Exercice ${i + 1} — ${EXAM.exercises[i].kind}</div>
          <div class="v">${fmt(p.got)} / ${fmt(p.max)}</div>
          <div class="meter"><i style="width:${(p.got / p.max) * 100}%"></i></div>
        </div>`).join('')}
    </div>
    <div class="grid-dots" aria-label="Accès rapide aux questions">${dots.join('')}</div>
    <p class="note">${nOk} bonne${nOk > 1 ? 's' : ''} réponse${nOk > 1 ? 's' : ''} sur ${TOTAL_Q} · Temps utilisé : ${mins} min ${String(secs).padStart(2, '0')} s${state.auto ? ' (copie remise automatiquement à la fin du temps)' : ''}.<br>
    Rappel : le ${LV.diploma} ${EXAM.level} est noté sur 100 (4 épreuves de 25 points). Il faut <b>50/100 au total</b> et <b>au moins 5/25 dans chaque épreuve</b>. Cliquez sur un numéro pour lire la correction détaillée ; le bouton « Voir le passage dans le texte » surligne la justification dans le document.</p>
    <div class="res-actions">
      <a class="btn" href="#q1">Lire la correction</a>
      <button class="btn ghost" id="restart">Recommencer l'épreuve</button>
    </div>`;
  $('#results').classList.remove('hidden');
  $('#restart').addEventListener('click', restart);
}

function restart(){
  clear();
  state = { answers: {}, start: null, submitted: false, elapsed: 0 };
  document.body.classList.remove('graded');
  $('#results').classList.add('hidden');
  $('#exam').classList.add('hidden');
  $('#footerSubmit').classList.remove('hidden');
  init();
  window.scrollTo({ top: 0 });
}

/* ---------- Init ---------- */
let resumable = false;
function init(){
  renderShell();
  renderQuestions();
  renderNav();
  $('#cover').classList.remove('hidden');
  resumable = false;
  $('#startBtn').addEventListener('click', () => { startExam(resumable); resumable = false; });
}

$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
$('#submitTop').addEventListener('click', askSubmit);
$('#submitBottom').addEventListener('click', askSubmit);
$('#mCancel').addEventListener('click', closeModal);
$('#mOk').addEventListener('click', () => grade(false));
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeModal();
  if (!PAGED || state.submitted || $('#exam').classList.contains('hidden') || !$('#modal').classList.contains('hidden')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') return go(cur + 1);
  if (e.key === 'ArrowLeft') return go(cur - 1);
  const i = LETTERS.indexOf(e.key.toUpperCase());
  const inp = i >= 0 && document.querySelector(`input[name="q${ALL[cur].id}"][value="${i}"]`);
  if (inp){ inp.checked = true; inp.dispatchEvent(new Event('change')); }
});

init();
const saved = load();
if (saved && saved.start){
  state = saved;
  if (state.submitted) grade(state.auto);
  else if (remaining() > 0){
    resumable = true;
    $('#startBtn').textContent = "Reprendre l'épreuve en cours";
    $('#resumeNote').innerHTML = `Une épreuve est en cours (${Object.keys(state.answers).length} réponse(s), ${Math.ceil(remaining() / 60)} min restantes). <a href="#" id="newExam">Recommencer à zéro</a>`;
    $('#resumeNote').classList.remove('hidden');
    $('#newExam').addEventListener('click', e => { e.preventDefault(); restart(); });
  } else grade(true);
}

/* Test hook: ?autotest=1 answers option A everywhere and submits (used by build_exam.js --test). */
if (new URLSearchParams(location.search).get('autotest')){
  clear(); state = { answers: {}, start: Date.now(), submitted: false, elapsed: 0 };
  startExam(true);
  ALL.forEach(q => { if (q.id !== ALL[ALL.length - 1].id) state.answers[q.id] = 0; });
  grade(false);
}
</script>
</body>
</html>
