<html lang="fr" data-theme="light"><!-- light by default; the ◐ button switches to dark -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELF B2 Compréhension écrite 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#1d1f24; --muted:#5d6270; --line:#ddd6c8;
  --accent:#1f3a8a; --accent-soft:#e6ebf8; --good:#17734a; --good-soft:#e3f3ea;
  --bad:#b42318; --bad-soft:#fbe9e7; --warn:#a15c00; --warn-soft:#fff1d9;
  --hl:#ffe58a; --on-accent:#fff; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --paper:#1d2027; --ink:#e8e6e1; --muted:#a2a7b3; --line:#343844;
    --accent:#8aa6ff; --accent-soft:#232c45; --good:#5fd39a; --good-soft:#17301f;
    --bad:#ff8a7a; --bad-soft:#3a1e1b; --warn:#ffbf5e; --warn-soft:#3a2c14;
    --hl:#6b5a12; --on-accent:#111; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#15171c; --paper:#1d2027; --ink:#e8e6e1; --muted:#a2a7b3; --line:#343844;
  --accent:#8aa6ff; --accent-soft:#232c45; --good:#5fd39a; --good-soft:#17301f;
  --bad:#ff8a7a; --bad-soft:#3a1e1b; --warn:#ffbf5e; --warn-soft:#3a2c14;
  --hl:#6b5a12; --on-accent:#111; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* Top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;font-weight:600;background:var(--accent);color:var(--on-accent);text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;width:38px;height:38px}

/* Cover */
.cover{max-width:760px;margin:40px auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:36px 32px;box-shadow:var(--shadow)}
.cover .kicker{text-transform:uppercase;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.cover h1{font-family:"Source Serif 4",Georgia,serif;font-size:34px;line-height:1.15;margin:8px 0 4px}
.cover .sub{color:var(--muted);margin:0 0 24px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 24px}
.fact{border:1px solid var(--line);border-radius:12px;padding:14px}
.fact b{display:block;font-size:22px}
.fact span{color:var(--muted);font-size:13px}
.consignes{background:var(--accent-soft);border-radius:12px;padding:16px 20px;margin-bottom:24px}
.consignes h3{margin:0 0 8px;font-size:15px}
.consignes ul{margin:0;padding-left:20px}
.consignes li{margin:4px 0}
.prof{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin-bottom:28px;color:var(--muted);font-style:italic}

/* Results */
.results{margin:28px auto 8px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);scroll-margin-top:76px}
.res-top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.score{font-family:"Source Serif 4",Georgia,serif;font-size:64px;font-weight:700;line-height:1}
.score small{font-size:26px;color:var(--muted);font-weight:400}
.verdict{flex:1;min-width:240px}
.verdict h2{margin:0 0 6px;font-size:22px}
.verdict p{margin:0;color:var(--muted)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:8px}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.bd{border:1px solid var(--line);border-radius:12px;padding:14px}
.bd .t{font-size:13px;color:var(--muted)}
.bd .v{font-weight:700;font-size:18px;margin:2px 0 8px}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.grid-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.dot{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:13px;text-decoration:none}
.dot.ok{background:var(--good-soft);color:var(--good)}
.dot.ko{background:var(--bad-soft);color:var(--bad)}
.dot.na{background:var(--warn-soft);color:var(--warn)}
.res-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin-top:16px}

/* Exercise */
.exercise{margin:32px 0}
.ex-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.ex-head h2{margin:0;font-size:22px}
.ex-head .pts{margin-left:auto;font-weight:600;color:var(--muted)}
.ex-consigne{color:var(--muted);margin:6px 0 18px;font-style:italic}
.ex-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.ex-grid.solo{grid-template-columns:minmax(0,820px);justify-content:center}
.q-text .gap{display:inline-block;min-width:5em;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:baseline}
.q-text .dlg{display:block;font-weight:500;margin-top:4px}
.q-text .inst{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-bottom:4px}
.lvl{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px}

/* Document components (use these classes inside exercise.document) */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 30px;box-shadow:var(--shadow);font-family:"Source Serif 4",Georgia,serif;font-size:17.5px;line-height:1.7;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.doc .doc-title{font-size:25px;line-height:1.25;margin:0 0 6px;font-weight:700}
.doc .chapo{font-weight:600;margin:0 0 14px}
.doc .src{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.doc p{margin:0 0 12px}
.doc .itw-q{font-family:Inter,sans-serif;font-weight:600;font-size:15px;margin:18px 0 6px;color:var(--accent)}
.situation{font-family:Inter,sans-serif;font-size:15px;background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.situation p{margin:6px 0}
.situation ul{margin:4px 0 0;padding-left:20px}
.ad{position:relative;border:1px solid var(--line);border-radius:12px;padding:14px 16px 6px 60px;margin-bottom:12px;font-size:16px;line-height:1.6}
.ad h4{margin:0 0 4px;font-size:17px}
.ad-letter{position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 15px Inter,sans-serif}
.mail-head{font-family:Inter,sans-serif;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.mail-head div{margin:2px 0}
.mail-head span{display:inline-block;width:62px;color:var(--muted)}
.ev{transition:background .3s;border-radius:3px}
body.graded .ev{background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.ev.hl{background:var(--hl)!important;box-shadow:0 0 0 3px var(--hl)}

/* Questions */
.questions{display:flex;flex-direction:column;gap:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;scroll-margin-top:84px}
.q-head{display:flex;gap:12px;align-items:flex-start}
.q-num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:14px}
.q-text{flex:1;margin:3px 0 0;font-weight:600}
.q-pts{flex:none;font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px 42px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.opt input:focus-visible + .l{outline:2px solid var(--accent);outline-offset:2px}
body.graded .opt{cursor:default}
body.graded .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--good)!important;background:var(--good-soft)!important}
.opt.correct .l{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.q.is-ok{border-left:4px solid var(--good)}
.q.is-ko{border-left:4px solid var(--bad)}
.q.is-na{border-left:4px solid var(--warn)}
.fb{margin:12px 0 4px 42px;padding:14px 16px;border-radius:10px;background:var(--bg);font-size:15px}
.fb .status{font-weight:700;margin-bottom:6px}
.fb .status.ok{color:var(--good)} .fb .status.ko{color:var(--bad)} .fb .status.na{color:var(--warn)}
.fb blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);font-family:"Source Serif 4",Georgia,serif;font-style:italic}
.fb ul{margin:6px 0;padding-left:18px}
.fb .tip{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.fb .see{margin-top:8px;border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}

.footer-submit{display:flex;justify-content:center;margin:40px 0 60px}

/* Paged mode (TCF): one question per screen, like the computer-based test */
body.paged:not(.graded) .q{display:none}
body.paged:not(.graded) .q.cur{display:block}
body.paged:not(.graded) .q-text{font-size:18px}
.qnav{max-width:820px;margin:18px auto 60px}
.qnav-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qpos{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.4;cursor:default}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pal{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600}
.pal.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.pal.now{outline:2px solid var(--accent);outline-offset:1px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:16px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal p{margin:0 0 18px;color:var(--muted)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:860px){
  .ex-grid{grid-template-columns:1fr}
  .doc{position:static;max-height:none;padding:22px 18px;font-size:17px}
  .opts,.fb{margin-left:0}
  .facts{grid-template-columns:1fr}
  .cover{padding:24px 18px;margin:20px auto}
  .cover h1{font-size:28px}
  .score{font-size:52px}
}
</style>
</head>

  <div class="wrap">
    <div class="brand" id="brand"></div>

<script>
const EXAM = {"level":"B2","epreuve":"Compréhension des écrits","sujet":2,"durationMin":60,"storeKey":"delf-b2-ce-sujet02","exercises":[{"kind":"Article de presse","theme":"Travail et organisation — la semaine de quatre jours dans les entreprises","points":9,"consigne":"Lisez le document puis répondez aux questions en choisissant la bonne réponse.","document":"\n        <h3 class=\"doc-title\">Semaine de quatre jours : les entreprises françaises passent au banc d'essai</h3>\n        <p class=\"chapo\"><span class=\"ev\" data-q=\"1\">Travailler quatre jours au lieu de cinq, sans perte de salaire : l'idée est désormais expérimentée par plusieurs centaines d'entreprises.</span> <span class=\"ev\" data-q=\"1\">Si les salariés se disent conquis, les économistes restent partagés sur ses effets à long terme.</span></p>\n        <p>À Nantes, le vendredi, les bureaux d'Ondalys sont déserts. Depuis janvier 2025, les 80 salariés de cette PME de logiciels ne travaillent plus que du lundi au jeudi, sans aucune baisse de rémunération. « Au début, j'ai cru à un gadget, avoue Sophie Lebrun, cheffe de projet. <span class=\"ev\" data-q=\"2\">Aujourd'hui, le vendredi, je m'occupe de mon père, qui vit seul à la campagne. Avant, je devais poser des jours de congé pour cela.</span> »</p>\n        <p>L'entreprise nantaise n'a rien d'une exception. D'après l'Observatoire du travail et des organisations, quelque 400 entreprises françaises ont adopté la semaine de quatre jours depuis 2023. Chez elles, les arrêts maladie auraient reculé de 30 % et les démissions de moitié. La productivité, elle, est restée stable. Ces résultats doivent néanmoins être nuancés : les entreprises qui se sont lancées sont volontaires, et souvent celles qui s'y prêtaient le mieux.</p>\n        <p>Sous une même étiquette se cachent deux formules. <span class=\"ev\" data-q=\"3\">La première, dite « semaine compressée », conserve les 35 heures hebdomadaires mais les répartit sur quatre jours, ce qui allonge chaque journée de près de deux heures.</span> La seconde réduit véritablement le temps de travail, à 32 heures payées 35. Plus coûteuse, cette dernière oblige à repenser l'organisation en profondeur : réunions raccourcies, tâches inutiles supprimées.</p>\n        <p>Pour Claire Dumontel, économiste du travail à l'université de Lille, le débat est souvent mal posé. « <span class=\"ev\" data-q=\"4\">La semaine de quatre jours n'est pas une recette miracle, mais ce n'est pas non plus une lubie. Elle fonctionne là où l'on peut réorganiser le travail.</span> » Elle met toutefois en garde contre un effet pervers : « <span class=\"ev\" data-q=\"4\">Si l'on se contente de faire en quatre jours ce que l'on faisait en cinq, on gagne un jour de repos, mais on le paie en fatigue.</span> » Dans un hôpital, un commerce ou une usine, ajoute-t-elle, un jour de moins pour chacun signifie surtout qu'il faut embaucher.</p>\n        <p>La formule rencontre aussi des résistances. Certains dirigeants redoutent une baisse du chiffre d'affaires, sans que les premières données ne l'aient confirmée. <span class=\"ev\" data-q=\"5\">Mais le principal écueil est ailleurs : selon l'Observatoire, un salarié sur quatre continue de répondre à ses courriels pendant son jour de repos, le plus souvent pour suivre le rythme de clients qui, eux, travaillent cinq jours.</span></p>\n        <p>Du côté du gouvernement, on avance à pas comptés. <span class=\"ev\" data-q=\"6\">Le ministère du Travail rappelle que la loi permet déjà de répartir les 35 heures sur quatre jours et écarte toute réduction généralisée du temps de travail, « qui ne peut se décider d'en haut ». Il a cependant lancé un appel à projets pour accompagner une cinquantaine de PME désireuses de tester la formule, à condition qu'elles acceptent d'en mesurer les effets.</span></p>\n      ","source":"Texte rédigé pour l'entraînement. Personnes, entreprise et observatoire fictifs.","questions":[{"id":1,"q":"Quel est le sujet principal de cet article ?","o":["La réussite d'une PME nantaise qui a décidé de fermer ses bureaux le vendredi.","Une organisation du travail de plus en plus testée, qui plaît aux salariés mais divise les experts.","Une loi récente qui oblige les entreprises françaises à passer à quatre jours de travail."],"a":1,"quote":"« Travailler quatre jours au lieu de cinq, sans perte de salaire : l'idée est désormais expérimentée par plusieurs centaines d'entreprises. Si les salariés se disent conquis, les économistes restent partagés sur ses effets à long terme. »","why":"Le chapô résume l'article en deux temps : un phénomène qui se développe (« expérimentée par plusieurs centaines d'entreprises ») et un débat (« les économistes restent partagés »). La réponse B reformule : « de plus en plus testée » = « expérimentée par plusieurs centaines d'entreprises », « plaît aux salariés » = « les salariés se disent conquis », « divise les experts » = « les économistes restent partagés ». Le « Si » du chapô a ici une valeur d'opposition (= « alors que »).","wrong":["A : <b>piège</b> de l'exemple d'ouverture : Ondalys n'est qu'une illustration. Le journaliste le dit lui-même : « L'entreprise nantaise n'a rien d'une exception. »","C : information contredite : il n'existe aucune loi de ce type. Le ministère « écarte toute réduction généralisée du temps de travail » ; les entreprises sont « volontaires »."],"tip":"Pour trouver l'idée générale, partez du titre et du chapô, puis vérifiez avec le dernier paragraphe. L'anecdote du début (une entreprise, une personne) sert d'accroche : elle n'est jamais le sujet principal."},{"id":2,"q":"Qu'est-ce que la nouvelle organisation a changé pour Sophie Lebrun ?","o":["Elle peut aider un proche sans avoir à prendre sur ses congés.","Elle travaille désormais depuis son domicile le vendredi.","Elle a accepté une légère baisse de salaire contre un jour libre."],"a":0,"quote":"« Aujourd'hui, le vendredi, je m'occupe de mon père, qui vit seul à la campagne. Avant, je devais poser des jours de congé pour cela. »","why":"« Je m'occupe de mon père » = elle aide un proche. L'opposition « Aujourd'hui » / « Avant » montre le changement : elle n'a plus besoin de « poser des jours de congé », c'est-à-dire de « prendre sur ses congés ».","wrong":["B : information absente et contradiction : le vendredi, « les bureaux […] sont déserts » parce que personne ne travaille ; il n'est pas question de télétravail.","C : contradiction : les salariés travaillent quatre jours « sans aucune baisse de rémunération »."],"tip":"Les marqueurs temporels « avant / aujourd'hui / désormais / depuis » signalent un changement : la bonne réponse se trouve dans la comparaison entre les deux moments."},{"id":3,"q":"Qu'est-ce qui caractérise la « semaine compressée » ?","o":["Elle diminue le nombre d'heures travaillées sans toucher au salaire.","Elle impose de réorganiser en profondeur les réunions et les tâches.","Elle maintient la durée de travail hebdomadaire, au prix de journées plus longues."],"a":2,"quote":"« La première, dite « semaine compressée », conserve les 35 heures hebdomadaires mais les répartit sur quatre jours, ce qui allonge chaque journée de près de deux heures. »","why":"« Conserver les 35 heures hebdomadaires » = maintenir la durée de travail de la semaine ; « allonger chaque journée » = des journées plus longues. Le connecteur « mais » introduit le prix à payer de cette formule.","wrong":["A : <b>piège</b> de la confusion entre les deux modèles : les « 32 heures payées 35 » correspondent à la <b>seconde</b> formule.","B : <b>piège</b> de la reprise : « cette dernière » renvoie à la seconde formule, la plus coûteuse. C'est elle qui « oblige à repenser l'organisation en profondeur »."],"tip":"Quand un texte présente « la première… la seconde… », faites un petit tableau avec les caractéristiques de chacune. Pour une reprise comme « cette dernière », remontez au nom le plus proche : ici, la seconde formule."},{"id":4,"q":"Que pense Claire Dumontel de la semaine de quatre jours ?","o":["C'est une mode passagère qui ne résistera pas à l'épreuve des faits.","Elle améliore la santé des salariés dans tous les secteurs d'activité.","Elle peut donner de bons résultats, si elle ne se réduit pas à travailler plus intensément."],"a":2,"quote":"« La semaine de quatre jours n'est pas une recette miracle, mais ce n'est pas non plus une lubie. Elle fonctionne là où l'on peut réorganiser le travail. » […] « Si l'on se contente de faire en quatre jours ce que l'on faisait en cinq, on gagne un jour de repos, mais on le paie en fatigue. »","why":"L'économiste adopte une position équilibrée : la mesure « fonctionne » dans certaines conditions. Puis « toutefois » introduit une mise en garde : faire en quatre jours le travail de cinq, c'est intensifier le travail et le « payer en fatigue ». La réponse C réunit les deux idées : une réussite possible, à une condition.","wrong":["A : contradiction : « ce n'est pas non plus une lubie » (= une idée bizarre, un caprice). Elle ne la considère pas comme une mode.","B : <b>piège</b> de l'exagération : elle dit au contraire que, dans un hôpital, un commerce ou une usine, la mesure pose problème (« il faut embaucher ») ; et la santé des salariés n'est pas son argument."],"tip":"La double négation « ce n'est pas X, mais ce n'est pas non plus Y » exprime une position nuancée, entre deux extrêmes. Les distracteurs reprennent souvent l'un des deux extrêmes."},{"id":5,"q":"Selon l'article, quel est le principal problème posé par la semaine de quatre jours ?","o":["Une partie des salariés ne parvient pas à se couper du travail pendant son jour libre.","Les entreprises concernées ont perdu une part importante de leur chiffre d'affaires.","Les clients refusent de travailler avec les entreprises fermées le vendredi."],"a":0,"quote":"« Mais le principal écueil est ailleurs : selon l'Observatoire, un salarié sur quatre continue de répondre à ses courriels pendant son jour de repos »","why":"« Le principal écueil » = le principal problème. « Un salarié sur quatre » = « une partie des salariés » ; « continuer de répondre à ses courriels pendant son jour de repos » = ne pas parvenir à se couper du travail. Le connecteur « Mais » et l'adverbe « ailleurs » montrent que les difficultés citées avant sont secondaires.","wrong":["B : <b>piège</b> de la crainte non confirmée : les dirigeants « redoutent » une baisse, « sans que les premières données ne l'aient confirmée ».","C : <b>piège</b> de la déformation : les clients sont bien cités, mais comme la <b>cause</b> du problème (les salariés suivent leur rythme). Le texte ne dit nulle part qu'ils refusent de travailler avec ces entreprises."],"tip":"Distinguez une crainte (« redouter », « craindre que ») d'un fait établi. Et quand un texte annonce « le principal problème est ailleurs », tout ce qui précède est relégué au second plan."},{"id":6,"q":"Quelle est la position du gouvernement ?","o":["Il s'apprête à imposer par la loi la semaine de 32 heures à toutes les entreprises.","Il refuse de généraliser la mesure, mais soutient quelques expérimentations encadrées.","Il finance toutes les entreprises qui choisissent de passer à quatre jours de travail."],"a":1,"quote":"« Le ministère du Travail […] écarte toute réduction généralisée du temps de travail […]. Il a cependant lancé un appel à projets pour accompagner une cinquantaine de PME désireuses de tester la formule, à condition qu'elles acceptent d'en mesurer les effets. »","why":"« Écarter toute réduction généralisée » = refuser de généraliser. « Cependant » introduit une action limitée : accompagner « une cinquantaine de PME » (= quelques expérimentations) « à condition qu'elles acceptent d'en mesurer les effets » (= des expérimentations encadrées). L'expression « avancer à pas comptés » signifie avancer avec prudence.","wrong":["A : contradiction : le ministère juge qu'une telle réduction « ne peut se décider d'en haut ».","C : <b>piège</b> de l'exagération : l'aide concerne seulement « une cinquantaine de PME », et sous condition, pas « toutes les entreprises »."],"tip":"Pour la position des autorités, repérez les verbes de refus (« écarter », « exclure », « se garder de ») et les connecteurs de restriction (« cependant », « toutefois ») : la bonne réponse combine souvent un refus et une action limitée."}]},{"kind":"Entretien","theme":"Culture et patrimoine — les artothèques et le prêt d'œuvres d'art aux particuliers","points":9,"consigne":"Lisez le document puis répondez aux questions en choisissant la bonne réponse.","document":"\n        <h3 class=\"doc-title\">« Accrocher une œuvre chez soi, c'est accepter de vivre avec elle »</h3>\n        <p class=\"chapo\">Emprunter un tableau ou une photographie comme on emprunte un livre : c'est le principe des artothèques, des structures publiques méconnues. Marion Keller dirige celle des Quatre-Vents, à Poitiers, depuis 2018.</p>\n        <p class=\"itw-q\">Qu'est-ce qu'une artothèque, exactement ?</p>\n        <p><span class=\"ev\" data-q=\"7\">C'est un lieu public qui possède une collection d'œuvres originales et qui les prête aux particuliers pour quelques semaines, contre une modeste cotisation.</span> <span class=\"ev\" data-q=\"7\">Nous ne sommes ni une galerie ni une boutique de reproductions. On ne vient pas chez nous pour acheter, et tout ce que nous prêtons est authentique.</span></p>\n        <p class=\"itw-q\">Qui sont vos emprunteurs ?</p>\n        <p>Nous comptons environ 1 500 abonnés. <span class=\"ev\" data-q=\"8\">La moitié d'entre eux n'avaient jamais mis les pieds dans un musée avant de venir ici. C'est de ce chiffre-là que je suis la plus fière</span>, bien plus que du nombre de prêts, qui a pourtant doublé en cinq ans. Beaucoup nous disent que le musée les intimide.</p>\n        <p class=\"itw-q\">Que change le fait de vivre avec une œuvre ?</p>\n        <p>Au musée, on passe trente secondes devant un tableau. Chez soi, on le voit matin et soir, sous des lumières différentes. Beaucoup d'emprunteurs nous racontent qu'ils ont d'abord détesté l'œuvre choisie… et qu'ils ont eu du mal à la rendre. <span class=\"ev\" data-q=\"9\">Ce regard répété transforme le rapport à l'art : on ne le consomme plus, on finit par dialoguer avec lui.</span></p>\n        <p class=\"itw-q\">On vous reproche parfois de faire courir des risques aux œuvres…</p>\n        <p><span class=\"ev\" data-q=\"10\">La crainte est compréhensible, et je ne prétends pas que le risque soit nul : chaque année, deux ou trois cadres nous reviennent abîmés. Mais il faut la ramener à sa juste mesure.</span> <span class=\"ev\" data-q=\"10\">Nous ne prêtons ni pièces fragiles ni œuvres de grande valeur, chacune est assurée</span>, et nous conseillons chaque emprunteur. Une œuvre qui dort dans une réserve est parfaitement protégée, c'est vrai, mais personne ne la voit.</p>\n        <p class=\"itw-q\">Comment choisissez-vous les œuvres que vous achetez ?</p>\n        <p>Notre règle est simple : <span class=\"ev\" data-q=\"11\">la moitié du budget d'acquisition va obligatoirement à des artistes de la région</span>, et nous n'achetons jamais une œuvre sans l'avoir vue en vrai. Nous ne cherchons pas non plus à plaire au plus grand nombre : il faut des œuvres qui dérangent.</p>\n        <p class=\"itw-q\">Quel est votre principal défi pour les années à venir ?</p>\n        <p><span class=\"ev\" data-q=\"12\">On pourrait croire que c'est l'argent : notre budget a baissé de 10 % cette année. En réalité, le plus difficile, c'est de nous faire connaître. La plupart des habitants ignorent encore qu'ils peuvent repartir avec une gravure sous le bras pour le prix d'une place de cinéma.</span> Nous allons donc sortir de nos murs et installer des œuvres dans les mairies de quartier et les maisons de retraite.</p>\n      ","source":"Entretien rédigé pour l'entraînement. Personne et établissement fictifs.","questions":[{"id":7,"q":"Comment Marion Keller définit-elle une artothèque ?","o":["Une structure publique qui prête des œuvres originales pour une durée limitée.","Une galerie qui permet d'essayer une œuvre chez soi avant de l'acheter.","Une boutique qui vend des reproductions d'œuvres célèbres à bas prix."],"a":0,"quote":"« C'est un lieu public qui possède une collection d'œuvres originales et qui les prête aux particuliers pour quelques semaines, contre une modeste cotisation. »","why":"« Un lieu public » = une structure publique ; « œuvres originales » = des œuvres authentiques, pas des copies ; « pour quelques semaines » = pour une durée limitée. Elle précise ensuite ce que l'artothèque n'est pas, ce qui confirme la définition.","wrong":["B : <b>piège</b> : le mot « galerie » est dans le texte, mais dans une négation : « Nous ne sommes <b>ni</b> une galerie… ». Et « On ne vient pas chez nous pour acheter ».","C : contradiction : elle refuse d'être « une boutique de reproductions » et affirme que « tout ce que nous prêtons est authentique »."],"tip":"La structure « ni X ni Y » élimine deux interprétations possibles. Les distracteurs reprennent volontiers ces mots (« galerie », « reproductions ») : vérifiez toujours s'ils sont dans une phrase affirmative ou négative."},{"id":8,"q":"Que montre le chiffre dont Marion Keller est la plus fière ?","o":["Le nombre de prêts a doublé grâce aux habitués des musées.","La moitié des abonnés quittent l'artothèque au bout de cinq ans.","L'artothèque attire un public peu habitué aux lieux culturels."],"a":2,"quote":"« La moitié d'entre eux n'avaient jamais mis les pieds dans un musée avant de venir ici. C'est de ce chiffre-là que je suis la plus fière »","why":"« Ne jamais avoir mis les pieds dans un musée » = ne jamais y être allé, donc être « peu habitué aux lieux culturels ». « Ce chiffre-là » renvoie à la phrase précédente : la moitié des abonnés. La suite le confirme : « le musée les intimide ».","wrong":["A : <b>piège</b> du chiffre secondaire : le doublement des prêts est mentionné, mais elle en est <b>moins</b> fière (« bien plus que du nombre de prêts ») ; et rien ne dit qu'il est dû aux habitués des musées, c'est même le contraire.","B : mauvais détail : « la moitié » et « cinq ans » appartiennent à deux informations différentes. Rien n'indique que des abonnés partent."],"tip":"Quand plusieurs chiffres se suivent, associez chacun à ce qu'il mesure. L'expression « ce chiffre-là » (démonstratif + « -là ») renvoie au chiffre qui vient d'être cité, pas à celui qui suit."},{"id":9,"q":"Selon elle, quel effet produit le fait de garder une œuvre chez soi ?","o":["La plupart des emprunteurs finissent par acheter l'œuvre empruntée.","La voir tous les jours modifie peu à peu la relation à l'œuvre.","Les emprunteurs la rendent souvent plus tôt, faute de l'apprécier."],"a":1,"quote":"« Chez soi, on le voit matin et soir, sous des lumières différentes. […] Ce regard répété transforme le rapport à l'art : on ne le consomme plus, on finit par dialoguer avec lui. »","why":"« Ce regard répété » = le fait de voir l'œuvre tous les jours ; « transformer le rapport à l'art » = modifier la relation à l'œuvre. « Finir par » indique une évolution progressive (« peu à peu »).","wrong":["A : information absente, et même contraire au principe : « On ne vient pas chez nous pour acheter. »","C : <b>piège</b> de la lecture incomplète : les emprunteurs ont « d'<b>abord</b> détesté l'œuvre », mais ensuite ils ont « eu du mal à la rendre ». Leur avis a changé."],"tip":"« D'abord… et ensuite / puis… » décrit une évolution : ne vous arrêtez pas à la première étape. Les points de suspension (« … et qu'ils ont eu du mal à la rendre ») marquent ici un effet de surprise, un retournement."},{"id":10,"q":"Comment Marion Keller réagit-elle au reproche sur les risques pour les œuvres ?","o":["Elle affirme qu'aucune œuvre n'a jamais été endommagée lors d'un prêt.","Elle admet que des dégâts se produisent, mais juge le risque limité et maîtrisé.","Elle reconnaît qu'il vaudrait mieux garder les œuvres dans les réserves."],"a":1,"quote":"« La crainte est compréhensible, et je ne prétends pas que le risque soit nul : chaque année, deux ou trois cadres nous reviennent abîmés. Mais il faut la ramener à sa juste mesure. Nous ne prêtons ni pièces fragiles ni œuvres de grande valeur, chacune est assurée »","why":"C'est un <b>accord partiel</b>. Concession : « La crainte est compréhensible », « je ne prétends pas que le risque soit nul » (= des dégâts se produisent). Puis « Mais » introduit son objection : « ramener à sa juste mesure » = relativiser ; les précautions (pas de pièces fragiles, assurance, conseils aux emprunteurs) montrent que le risque est « maîtrisé ».","wrong":["A : contradiction : « deux ou trois cadres nous reviennent abîmés » chaque année.","C : <b>piège</b> de la concession : elle admet qu'une œuvre en réserve « est parfaitement protégée, c'est vrai », mais « personne ne la voit ». C'est un argument <b>contre</b> la conservation en réserve."],"tip":"« C'est vrai, mais… », « je ne prétends pas que…, mais… » : la concession accorde un point à l'adversaire, l'opinion réelle vient après le « mais ». Ne confondez jamais ce qui est concédé avec la conclusion."},{"id":11,"q":"Quel principe guide les achats de l'artothèque ?","o":["Les œuvres sont choisies d'après les goûts de la majorité des abonnés.","Les achats se font surtout sur catalogue, afin de réduire les coûts.","Une part fixe du budget est réservée à des créateurs de la région."],"a":2,"quote":"« la moitié du budget d'acquisition va obligatoirement à des artistes de la région »","why":"« La moitié du budget […] obligatoirement » = une part fixe, imposée ; « budget d'acquisition » = l'argent destiné aux achats ; « artistes de la région » = créateurs locaux.","wrong":["A : contradiction : « Nous ne cherchons pas non plus à plaire au plus grand nombre » ; elle veut même « des œuvres qui dérangent ».","B : contradiction : « nous n'achetons jamais une œuvre sans l'avoir vue en vrai »."],"tip":"Les mots de la règle (« obligatoirement », « jamais », « toujours », « notre règle est simple ») signalent un principe. Vérifiez qu'une option ne transforme pas un « jamais » du texte en pratique habituelle."},{"id":12,"q":"Quel est, pour Marion Keller, le principal défi de l'artothèque ?","o":["Faire savoir aux habitants que ce service existe et qu'il est accessible.","Compenser la forte baisse des subventions qu'elle a subie cette année.","Ouvrir de nouvelles artothèques dans les maisons de retraite de la ville."],"a":0,"quote":"« On pourrait croire que c'est l'argent : notre budget a baissé de 10 % cette année. En réalité, le plus difficile, c'est de nous faire connaître. La plupart des habitants ignorent encore qu'ils peuvent repartir avec une gravure sous le bras pour le prix d'une place de cinéma. »","why":"« Se faire connaître » = faire savoir que le service existe. « Pour le prix d'une place de cinéma » montre qu'il est accessible, c'est-à-dire peu cher. « En réalité » introduit la vraie réponse, après une idée écartée.","wrong":["B : <b>piège</b> du conditionnel réfuté : « On pourrait croire que c'est l'argent » est une hypothèse aussitôt rejetée par « En réalité ».","C : mauvais détail : elle veut « installer des œuvres » dans les maisons de retraite, pas y ouvrir de nouvelles artothèques."],"tip":"« On pourrait croire que X… En réalité, Y » : X est une fausse piste, Y est la réponse. Même schéma avec « On pense souvent que… Pourtant… » ou « Contrairement à ce qu'on croit… »."}]},{"kind":"Texte argumentatif (tribune)","theme":"Médias et information — l'information en continu et les alertes d'actualité","points":7,"consigne":"Lisez le document puis répondez aux questions en choisissant la bonne réponse.","document":"\n        <h3 class=\"doc-title\">Éteignons les alertes : l'information mérite mieux que l'urgence</h3>\n        <p>Il est 7 h 12 et mon téléphone vibre déjà : « ALERTE – Explosion dans un immeuble à Lyon ». À 7 h 40, on apprend qu'il s'agissait d'une fuite de gaz sans victime ; à 9 heures, que l'immeuble ne se trouvait même pas à Lyon. On présente volontiers l'information en continu comme un progrès démocratique : tout savoir, tout de suite, serait le privilège du citoyen moderne. <span class=\"ev\" data-q=\"13\">Je pense au contraire que la course à l'immédiateté appauvrit l'information, et qu'il est temps, pour les rédactions comme pour les lecteurs, de choisir la lenteur.</span></p>\n        <p>D'abord, la vitesse se gagne aux dépens de la vérification. <span class=\"ev\" data-q=\"14\">Dans de nombreuses rédactions, on publie d'abord et on vérifie ensuite : on met la charrue avant les bœufs, puis on corrige discrètement.</span> Or un rectificatif n'a jamais le retentissement de l'alerte initiale. <span class=\"ev\" data-q=\"15\">Selon une enquête menée auprès de 2 000 lecteurs par l'Institut Médias et Société, seuls 15 % d'entre eux avaient vu la correction d'une information erronée qu'ils avaient pourtant lue.</span></p>\n        <p>Ensuite, le flux permanent épuise ceux qu'il prétend informer. À force de recevoir des dizaines d'alertes par jour, on ne distingue plus l'essentiel de l'anecdotique : la démission d'un ministre et le score d'un match font vibrer le téléphone de la même façon. <span class=\"ev\" data-q=\"16\">Beaucoup finissent par décrocher. Ce n'est pas par paresse qu'ils s'informent moins, mais par saturation : un lecteur sur trois déclare aujourd'hui éviter volontairement l'actualité.</span> Et le citoyen qui fuit l'information laisse le champ libre aux rumeurs.</p>\n        <p>Je ne plaide pas pour un retour au seul journal du soir. L'information rapide est parfois vitale : en cas d'inondation ou d'accident industriel, chaque minute compte. Je ne crois pas davantage aux encadrés « Vérification » que certains sites ajoutent en bas de leurs articles : <span class=\"ev\" data-q=\"17\">ils servent surtout à donner le change, en corrigeant après coup ce qu'il aurait fallu vérifier avant, sans rien changer à la logique de l'urgence.</span></p>\n        <p>Des alternatives existent pourtant. <span class=\"ev\" data-q=\"18\">Le quotidien régional <i>L'Écho des Vallées</i> a supprimé l'an dernier toutes ses notifications, à l'exception des alertes de sécurité, et publie chaque soir une seule lettre, intitulée « Ce que l'on sait vraiment ». Ses lecteurs ont d'abord protesté ; un an plus tard, le nombre d'abonnés a progressé de 12 %, et les signalements d'erreurs ont presque disparu.</span></p>\n        <p><span class=\"ev\" data-q=\"19\">Rédactions, cessez de confondre être le premier et être le meilleur. Réservez les alertes aux véritables urgences, signalez clairement ce qui n'est pas encore vérifié, donnez à vos journalistes le temps d'enquêter.</span> Et nous, lecteurs, désactivons quelques notifications : <span class=\"ev\" data-q=\"19\">une information juste qui arrive une heure plus tard vaut mieux que dix nouvelles immédiates, mais fausses.</span></p>\n      ","source":"Tribune rédigée pour l'entraînement. Journal, institut, personnes et chiffres fictifs.","questions":[{"id":13,"q":"Quelle est la thèse défendue par l'auteur ?","o":["L'information en continu est un progrès, car elle permet au citoyen de tout savoir.","Les médias devraient cesser de couvrir les faits divers et les accidents.","La recherche de la rapidité nuit à la qualité de l'information."],"a":2,"quote":"« Je pense au contraire que la course à l'immédiateté appauvrit l'information, et qu'il est temps, pour les rédactions comme pour les lecteurs, de choisir la lenteur. »","why":"La thèse est introduite par « Je pense au contraire ». « La course à l'immédiateté » = la recherche de la rapidité ; « appauvrir l'information » = nuire à sa qualité.","wrong":["A : <b>piège</b> de l'idée réfutée : c'est l'opinion courante que l'auteur rapporte (« On présente volontiers… », avec le conditionnel « serait ») pour la contester aussitôt (« au contraire »).","B : information absente : l'auteur ne critique pas les sujets traités, mais la vitesse de publication. Il défend même l'information rapide en cas d'accident."],"tip":"Dans une introduction de tribune, l'idée reçue (« on présente volontiers », « on entend souvent », conditionnel de rumeur) précède la thèse (« je pense au contraire », « je soutiens »). La thèse est toujours du côté du « je »."},{"id":14,"q":"Dans ce texte, « mettre la charrue avant les bœufs » signifie :","o":["faire les choses dans le mauvais ordre, en publiant avant de vérifier.","travailler lentement, en prenant le temps de bien faire chaque étape.","faire porter à d'autres la responsabilité de ses propres erreurs."],"a":0,"quote":"« on publie d'abord et on vérifie ensuite : on met la charrue avant les bœufs, puis on corrige discrètement. »","why":"Normalement, les bœufs tirent la charrue : ils doivent donc être devant. Mettre la charrue avant les bœufs, c'est inverser l'ordre logique. Le contexte l'explique : les deux-points reprennent l'idée « on publie d'abord et on vérifie ensuite », alors qu'il faudrait faire l'inverse.","wrong":["B : contresens : l'expression critique au contraire la précipitation, l'absence de vérification préalable.","C : information absente : il n'est pas question de rejeter la faute sur d'autres ; les rédactions corrigent elles-mêmes, « discrètement »."],"tip":"Une expression idiomatique est souvent expliquée juste avant ou juste après, en particulier autour des deux-points. Cherchez la phrase « traduction » : ici, « on publie d'abord et on vérifie ensuite »."},{"id":15,"q":"Que révèle l'enquête de l'Institut Médias et Société ?","o":["15 % des informations publiées doivent ensuite être corrigées.","La grande majorité des lecteurs ignorent qu'une information fausse a été rectifiée.","Les lecteurs font moins confiance aux médias qui publient des rectificatifs."],"a":1,"quote":"« seuls 15 % d'entre eux avaient vu la correction d'une information erronée qu'ils avaient pourtant lue. »","why":"Si « seuls 15 % » ont vu la correction, 85 % ne l'ont pas vue : c'est « la grande majorité ». « Une information erronée » = une information fausse ; « la correction » = le rectificatif. L'enquête illustre la phrase précédente : un rectificatif « n'a jamais le retentissement de l'alerte initiale ».","wrong":["A : <b>piège</b> du chiffre déplacé : 15 % désigne une proportion de <b>lecteurs</b>, pas une proportion d'informations corrigées.","C : information absente : l'enquête ne mesure pas la confiance des lecteurs."],"tip":"« Seuls », « ne… que », « à peine » orientent un chiffre vers le peu : 15 % présenté avec « seuls » met en valeur les 85 % restants. Demandez-vous toujours : ce pourcentage, il porte sur qui ou sur quoi ?"},{"id":16,"q":"Selon l'auteur, quelle est la conséquence de l'accumulation des alertes ?","o":["Les lecteurs, devenus paresseux, ne cherchent plus à s'informer.","Les lecteurs s'intéressent désormais plus au sport qu'à la politique.","Saturés, certains lecteurs se détournent volontairement de l'actualité."],"a":2,"quote":"« Beaucoup finissent par décrocher. Ce n'est pas par paresse qu'ils s'informent moins, mais par saturation : un lecteur sur trois déclare aujourd'hui éviter volontairement l'actualité. »","why":"« Décrocher » (familier) = abandonner, cesser de suivre. « Par saturation » = parce qu'ils sont saturés ; « éviter volontairement l'actualité » = se détourner volontairement de l'actualité. « Un lecteur sur trois » justifie « certains lecteurs ».","wrong":["A : <b>piège</b> de la cause refusée : « Ce n'est <b>pas</b> par paresse […], mais par saturation ». L'option reprend la cause que l'auteur écarte.","B : mauvais détail : la démission d'un ministre et le score d'un match illustrent le fait que tout est mis au même niveau ; rien ne dit que les lecteurs préfèrent le sport."],"tip":"La structure « ce n'est pas X, mais Y » (ou « non pas X, mais Y ») sépare la mauvaise explication de la bonne. Les distracteurs reprennent souvent X, le terme rejeté."},{"id":17,"q":"Les encadrés « Vérification » servent « à donner le change ». Cela signifie qu'ils permettent :","o":["de faire croire qu'on se soucie de la vérification sans changer de pratiques.","de remplacer systématiquement les informations fausses par des informations exactes.","d'échanger des informations vérifiées avec d'autres rédactions."],"a":0,"quote":"« ils servent surtout à donner le change, en corrigeant après coup ce qu'il aurait fallu vérifier avant, sans rien changer à la logique de l'urgence. »","why":"« Donner le change » = tromper, créer une illusion, faire croire quelque chose de rassurant. Le contexte le confirme : ces encadrés donnent l'apparence du sérieux, mais ils ne changent rien « à la logique de l'urgence ». L'auteur le dit d'ailleurs clairement : « Je ne crois pas davantage » à ces encadrés.","wrong":["B : exagération et contresens : ils corrigent « après coup », ce qui n'empêche pas l'erreur initiale de circuler ; et l'auteur les juge inefficaces.","C : <b>piège</b> du sens littéral : « le change » n'a ici rien à voir avec un échange. Il s'agit d'une expression figée."],"tip":"Plusieurs expressions dénoncent une action de façade : « donner le change », « servir d'alibi », « faire illusion », « jeter de la poudre aux yeux », « un effet d'annonce ». Ne les traduisez jamais mot à mot."},{"id":18,"q":"Pourquoi l'auteur cite-t-il l'exemple de L'Écho des Vallées ?","o":["Pour montrer que les lecteurs refusent de renoncer aux notifications.","Pour prouver qu'un média peut ralentir tout en gagnant des abonnés et en fiabilité.","Pour montrer qu'il faudrait supprimer toutes les alertes, y compris de sécurité."],"a":1,"quote":"« Ses lecteurs ont d'abord protesté ; un an plus tard, le nombre d'abonnés a progressé de 12 %, et les signalements d'erreurs ont presque disparu. »","why":"L'exemple illustre la phrase qui l'introduit : « Des alternatives existent pourtant ». Le journal a ralenti (une seule lettre par soir) ; résultat, « le nombre d'abonnés a progressé » et « les signalements d'erreurs ont presque disparu » (= plus de fiabilité).","wrong":["A : <b>piège</b> passé / présent : les lecteurs ont « d'<b>abord</b> protesté », mais « un an plus tard », les abonnés sont plus nombreux. La réaction initiale n'est pas le résultat final.","C : contradiction : le journal a gardé les « alertes de sécurité », et l'auteur affirme que l'information rapide est « parfois vitale »."],"tip":"Pour comprendre la fonction d'un exemple, lisez la phrase qui l'annonce (« Des alternatives existent pourtant ») et regardez le résultat final (« un an plus tard… »), pas seulement la première réaction."},{"id":19,"q":"Quel est le ton général de cette tribune ?","o":["Polémique et agressif : l'auteur accuse les journalistes de mentir volontairement.","Neutre et informatif : l'auteur expose les avantages et les limites de l'information en continu.","Engagé et constructif : l'auteur critique une pratique et propose d'autres façons de faire."],"a":2,"quote":"« Rédactions, cessez de confondre être le premier et être le meilleur. Réservez les alertes aux véritables urgences, signalez clairement ce qui n'est pas encore vérifié, donnez à vos journalistes le temps d'enquêter. »","why":"Le ton est <b>engagé</b> : première personne (« Je pense », « Je ne plaide pas »), apostrophe (« Rédactions, »), impératifs (« cessez », « réservez », « désactivons »). Il est aussi <b>constructif</b> : l'auteur cite une alternative qui fonctionne et formule des propositions concrètes. Sa concession (l'information rapide est « parfois vitale ») montre qu'il reste nuancé.","wrong":["A : exagération : l'auteur critique la précipitation, pas une volonté de mentir ; les erreurs viennent de l'urgence, et il demande qu'on donne aux journalistes « le temps d'enquêter ».","B : l'auteur ne se contente pas d'exposer : il prend clairement position (« Je pense au contraire ») et donne des consignes aux rédactions et aux lecteurs."],"tip":"Pour le ton, relevez les indices : « je » + verbes d'opinion et impératifs = engagé ; concession + propositions = nuancé, constructif ; accusations et vocabulaire violent = polémique ; absence de « je » et de jugement = neutre."}]}]};

function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

  const c = EXAM.cover || {};

  $('#cover').innerHTML = IS_TCF ? tcfCover() : `

/* ---------- Questions ---------- */
function renderQuestions(){
  document.querySelectorAll('.questions').forEach(box => {
    const ex = EXAM.exercises[+box.dataset.ex];
    const pts = ex.points / ex.questions.length;
    box.innerHTML = ex.questions.map(q => `
      <div class="q" id="q${q.id}">
        <div class="q-head">
          <span class="q-num">${q.id}</span>
          <p class="q-text">${q.q}</p>
          <span class="q-pts">${fmt(pts)} pt</span>
        </div>
        <div class="opts" role="radiogroup" aria-label="Question ${q.id}">
          ${q.o.map((txt, i) => `
            <label class="opt" data-q="${q.id}" data-i="${i}">
              <input type="radio" name="q${q.id}" value="${i}">
              <span class="l">${LETTERS[i]}</span>
              <span>${txt}</span>
            </label>`).join('')}
        </div>
        <div class="fb hidden"></div>
      </div>`).join('');
  });
  document.querySelectorAll('.opt input').forEach(inp => {
    inp.addEventListener('change', e => {
      if (state.submitted) return;
      const id = +e.target.name.slice(1);
      state.answers[id] = +e.target.value;
      paintSelection(id);
      updateProgress();
      save();
    });
  });
}

function paintSelection(id){
  document.querySelectorAll(`.opt[data-q="${id}"]`).forEach(l => {
    const sel = state.answers[id] === +l.dataset.i;
    l.classList.toggle('sel', sel);
    l.querySelector('input').checked = sel;
  });
}
function updateProgress(){ $('#progress').textContent = `${Object.keys(state.answers).length} / ${TOTAL_Q} réponses`; paintNav(); }

function renderNav(){
  if (!PAGED) return;
  $('#qnav').innerHTML = `
    <div class="qnav-row">
      <button class="btn ghost" id="prevQ">← Précédente</button>
      <span class="qpos" id="qpos"></span>
      <button class="btn" id="nextQ">Suivante →</button>
    </div>
    <div class="palette" aria-label="Aller à la question">${ALL.map((q, i) => `<button class="pal" data-i="${i}" aria-label="Question ${q.id}">${q.id}</button>`).join('')}</div>
    <p class="note">Raccourcis : touches A, B, C, D pour répondre · flèches ← → pour changer de question.</p>`;
  $('#prevQ').addEventListener('click', () => go(cur - 1));
  $('#nextQ').addEventListener('click', () => cur === TOTAL_Q - 1 ? askSubmit() : go(cur + 1));
  document.querySelectorAll('.pal').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
}
function go(i){
  if (!PAGED || state.submitted) return;
  cur = Math.max(0, Math.min(TOTAL_Q - 1, i));
  state.cur = cur; save();
  document.querySelectorAll('.q').forEach(c => c.classList.toggle('cur', c.id === `q${ALL[cur].id}`));
  paintNav();
  window.scrollTo({ top: 0 });
}
function paintNav(){
  if (!PAGED || !$('#qpos')) return;
  $('#qpos').textContent = `Question ${cur + 1} / ${TOTAL_Q}`;
  $('#prevQ').disabled = cur === 0;
  $('#nextQ').textContent = cur === TOTAL_Q - 1 ? 'Remettre ma copie' : 'Suivante →';
  document.querySelectorAll('.pal').forEach((b, i) => {
    b.classList.toggle('done', state.answers[ALL[i].id] !== undefined);
    b.classList.toggle('now', i === cur);
  });
}

/* ---------- Timer ---------- */
function remaining(){ return Math.max(0, DURATION - Math.floor((Date.now() - state.start) / 1000)); }
function showTime(sec){
  const m = String(Math.floor(sec / 60)).padStart(2, '0'), s = String(sec % 60).padStart(2, '0');
  const t = $('#timer');
  t.textContent = `⏱ ${m}:${s}`;
  const warnAt = Math.min(600, DURATION / 3), dangerAt = Math.min(300, DURATION / 7.5); // 10/5 min, or 5/2 min for a 15-min paper
  t.classList.toggle('warn', sec <= warnAt && sec > dangerAt);
  t.classList.toggle('danger', sec <= dangerAt);
}
function startTimer(){
  clearInterval(tick);
  const step = () => { const r = remaining(); showTime(r); if (r <= 0){ clearInterval(tick); grade(true); } };
  step();
  tick = setInterval(step, 1000);
}

/* ---------- Start ---------- */
function startExam(resume){
  if (!resume){ state = { answers: {}, start: Date.now(), submitted: false, elapsed: 0 }; save(); }
  $('#cover').classList.add('hidden');
  $('#exam').classList.remove('hidden');
  ['#progress', '#timer', '#submitTop'].forEach(s => $(s).classList.remove('hidden'));
  Object.keys(state.answers).forEach(id => paintSelection(+id));
  if (PAGED){
    document.body.classList.add('paged');
    $('#qnav').classList.remove('hidden');
    $('#footerSubmit').classList.add('hidden');
    go(state.cur || 0);
  }
  updateProgress();
  startTimer();
  window.scrollTo({ top: 0 });
}

/* ---------- Submit & grade ---------- */
function askSubmit(){
  const missing = TOTAL_Q - Object.keys(state.answers).length;
  $('#mText').innerHTML = missing
    ? `Attention : <b>${missing} question${missing > 1 ? 's' : ''} sans réponse</b>. Une réponse vide vaut 0 point, alors qu'une réponse au hasard a toujours une chance d'être juste.`
    : `Vous avez répondu aux ${TOTAL_Q} questions. Une fois la copie remise, vous ne pourrez plus modifier vos réponses.`;
  $('#modal').classList.remove('hidden');
  $('#mOk').focus();
}
function closeModal(){ $('#modal').classList.add('hidden'); }

function grade(auto){
  if (!state.submitted){
    state.submitted = true;
    state.elapsed = Math.min(DURATION, Math.floor((Date.now() - state.start) / 1000));
    state.auto = !!auto;
    save();
  }
  clearInterval(tick);
  closeModal();
  document.body.classList.add('graded');
  ['#timer', '#submitTop', '#progress'].forEach(s => $(s).classList.add('hidden'));
  $('#footerSubmit').classList.add('hidden');
  $('#qnav').classList.add('hidden');
  document.querySelectorAll('.q.cur').forEach(c => c.classList.remove('cur'));
  $('#cover').classList.add('hidden');
  $('#exam').classList.remove('hidden');
  document.querySelectorAll('.opt input').forEach(i => i.disabled = true);

  let total = 0; const perEx = EXAM.exercises.map(e => ({ got: 0, max: e.points }));
  const dots = [];

  ALL.forEach(q => {
    const user = state.answers[q.id];
    const ok = user === q.a, na = user === undefined;
    if (ok){ total += q.pts; perEx[q.ex].got += q.pts; }
    dots.push(`<a href="#q${q.id}" class="dot ${na ? 'na' : ok ? 'ok' : 'ko'}" title="Question ${q.id}">${q.id}</a>`);

    const card = $(`#q${q.id}`);
    card.classList.add(na ? 'is-na' : ok ? 'is-ok' : 'is-ko');
    card.querySelectorAll('.opt').forEach(l => {
      const i = +l.dataset.i;
      l.classList.remove('sel');
      if (i === q.a) l.classList.add('correct');
      else if (i === user) l.classList.add('wrong');
      l.querySelector('input').checked = i === user;
    });

    const status = na
      ? `<div class="status na">Sans réponse — bonne réponse : ${LETTERS[q.a]} (0 / ${fmt(q.pts)} pt)</div>`
      : ok
        ? `<div class="status ok">✔ Bonne réponse : ${LETTERS[q.a]} (+${fmt(q.pts)} pt)</div>`
        : `<div class="status ko">✘ Vous avez répondu ${LETTERS[user]} — bonne réponse : ${LETTERS[q.a]} (0 / ${fmt(q.pts)} pt)</div>`;
    const lvlTag = IS_TCF && q.lvl ? `<span class="lvl">Niveau ${q.lvl}</span>` : '';
    const fb = card.querySelector('.fb');
    fb.innerHTML = `${status.replace(/<\/div>$/, lvlTag + '</div>')}
      ${q.quote ? `<blockquote>${q.quote}</blockquote>` : ''}
      <div>${q.why}</div>
      <ul>${q.wrong.map(w => `<li>${w}</li>`).join('')}</ul>
      <div class="tip">💡 <b>Conseil du professeur :</b> ${q.tip}</div>
      ${document.querySelector(`.ev[data-q="${q.id}"]`) ? `<button class="see" data-see="${q.id}">Voir le passage dans le texte</button>` : ''}`;
    fb.classList.remove('hidden');
  });

  document.querySelectorAll('[data-see]').forEach(b => b.addEventListener('click', () => seeInText(+b.dataset.see)));
  renderResults(total, perEx, dots);
  $('#results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function seeInText(id){
  document.querySelectorAll('.ev.hl').forEach(e => e.classList.remove('hl'));
  const spans = document.querySelectorAll(`.ev[data-q="${id}"]`);
  spans.forEach(s => s.classList.add('hl'));
  if (spans[0]) spans[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => spans.forEach(s => s.classList.remove('hl')), 4000);
}

function verdictFor(score){
  const r = score / TOTAL_PTS; // thresholds expressed for /25: 5, 12.5, 18, 22
  if (r < 0.2) return { cls: 'bad', tag: 'Note éliminatoire', title: 'Il faut retravailler les bases de la compréhension.',
    text: "Une note inférieure à 5/25 dans une épreuve est éliminatoire, même si le total est suffisant. Entraînez-vous chaque jour avec des documents courts et apprenez à repérer l'idée principale de chaque paragraphe." };
  if (r < 0.5) return { cls: 'warn', tag: 'Fragile', title: "Vous n'êtes pas éliminé, mais la marge est faible.",
    text: "Vous comprenez une partie des documents, mais les reformulations et les détails vous échappent encore. Relisez les explications ci-dessous : notez chaque piège dans lequel vous êtes tombé." };
  if (r < 0.72) return { cls: 'good', tag: `Niveau ${EXAM.level} en vue`, title: 'Bon travail, vous avez la moyenne sur cette épreuve !',
    text: `Vous saisissez l'essentiel des documents. ${LV.progress}` };
  if (r < 0.88) return { cls: 'good', tag: 'Très bien', title: 'Très bonne compréhension des documents.',
    text: `${LV.master} Les quelques erreurs restantes portent probablement sur des détails : relisez toujours la phrase exacte avant de valider.` };
  return { cls: 'good', tag: 'Excellent', title: 'Excellent ! Vous êtes prêt(e) pour le jour J.',
    text: `Votre compréhension est fine et précise. Vous pouvez commencer à vous entraîner sur des sujets du ${LV.next}.` };
}

/* TCF: per-CEFR-level success; a level is reached when ≥ 60 % of its items (and of every easier level) are right. */
function tcfResults(total, dots, timeNote){
  const stats = CEFR.filter(l => ALL.some(q => q.lvl === l)).map(l => {
    const qs = ALL.filter(q => q.lvl === l);
    return { l, n: qs.length, ok: qs.filter(q => state.answers[q.id] === q.a).length };
  });
  let reached = null;
  for (const s of stats) { if (s.ok / s.n >= 0.6) reached = s.l; else break; }
  const gap = reached ? CEFR.indexOf(EXAM.level) - CEFR.indexOf(reached) : 9;
  const v = gap <= 0
    ? { cls: 'good', tag: `Niveau ${reached} atteint`, title: gap < 0 ? 'Excellent ! Vous dépassez le niveau visé.' : `Bravo, vous maîtrisez les structures du niveau ${EXAM.level} !`,
        text: gap < 0 ? 'Vous réussissez même les questions du niveau supérieur. Entraînez-vous maintenant sur un sujet plus difficile.' : 'Relisez les explications des questions manquées : ce sont souvent les points qui vous feront passer au niveau suivant.' }
    : gap === 1
      ? { cls: 'warn', tag: `Niveau ${reached} consolidé`, title: `Le niveau ${EXAM.level} est en vue, mais pas encore acquis.`,
          text: `Vous maîtrisez les structures du niveau ${reached}. Notez chaque règle expliquée ci-dessous pour les questions de niveau ${EXAM.level} manquées et revoyez-les cette semaine.` }
      : { cls: 'bad', tag: reached ? `Niveau ${reached}` : `En dessous de ${stats[0].l}`, title: 'Il faut consolider les bases avant de viser ce niveau.',
          text: `Commencez par les questions des premiers niveaux : chaque erreur correspond à une règle à revoir (conjugaison, pronoms, prépositions…).` };
  $('#results').innerHTML = `
    <div class="res-top">
      <div class="score">${fmt(total)}<small> / ${fmt(TOTAL_PTS)}</small></div>
      <div class="verdict">
        <span class="tag ${v.cls}">${v.tag}</span>
        <h2>${v.title}</h2>
        <p>${v.text}</p>
      </div>
    </div>
    <div class="breakdown">
      ${stats.map(s => `
        <div class="bd">
          <div class="t">Questions de niveau ${s.l}</div>
          <div class="v">${s.ok} / ${s.n}</div>
          <div class="meter"><i style="width:${(s.ok / s.n) * 100}%"></i></div>
        </div>`).join('')}
    </div>
    <div class="grid-dots" aria-label="Accès rapide aux questions">${dots.join('')}</div>
    <p class="note">${timeNote}<br>
    Rappel : le TCF n'a pas de note de réussite. Chaque épreuve donne un score de 100 à 699 et un niveau du CECRL
    (${['B1', 'B2', 'C1', 'C2'].map(l => `${l} = ${TCF_BANDS[l]}`).join(', ')}), et les questions difficiles rapportent plus de points.
    Ce sujet blanc donne une <b>estimation indicative</b> : un niveau est considéré comme atteint si vous réussissez au moins 60 % de ses questions et de celles des niveaux inférieurs.
    ${reached ? `Estimation : <b>niveau ${reached}</b> (≈ ${TCF_BANDS[reached]} points sur l'échelle TCF).` : ''}</p>
    <div class="res-actions">
      <a class="btn" href="#q1">Lire la correction</a>
      <button class="btn ghost" id="restart">Recommencer l'épreuve</button>
    </div>`;
}

function renderResults(total, perEx, dots){
  if (IS_TCF){
    const nOk = ALL.filter(q => state.answers[q.id] === q.a).length;
    const mins = Math.floor(state.elapsed / 60), secs = state.elapsed % 60;
    tcfResults(total, dots, `${nOk} bonne${nOk > 1 ? 's' : ''} réponse${nOk > 1 ? 's' : ''} sur ${TOTAL_Q} · Temps utilisé : ${mins} min ${String(secs).padStart(2, '0')} s${state.auto ? ' (copie remise automatiquement à la fin du temps)' : ''}.`);
    $('#results').classList.remove('hidden');
    $('#restart').addEventListener('click', restart);
    return;
  }
  const v = verdictFor(total);
  const nOk = ALL.filter(q => state.answers[q.id] === q.a).length;
  const mins = Math.floor(state.elapsed / 60), secs = state.elapsed % 60;
  $('#results').innerHTML = `
    <div class="res-top">
      <div class="score">${fmt(total)}<small> / ${fmt(TOTAL_PTS)}</small></div>
      <div class="verdict">
        <span class="tag ${v.cls}">${v.tag}</span>
        <h2>${v.title}</h2>
        <p>${v.text}</p>
      </div>
    </div>
    <div class="breakdown">
      ${perEx.map((p, i) => `
        <div class="bd">
          <div class="t">Exercice ${i + 1} — ${EXAM.exercises[i].kind}</div>
          <div class="v">${fmt(p.got)} / ${fmt(p.max)}</div>
          <div class="meter"><i style="width:${(p.got / p.max) * 100}%"></i></div>
        </div>`).join('')}
    </div>
    <div class="grid-dots" aria-label="Accès rapide aux questions">${dots.join('')}</div>
    <p class="note">${nOk} bonne${nOk > 1 ? 's' : ''} réponse${nOk > 1 ? 's' : ''} sur ${TOTAL_Q} · Temps utilisé : ${mins} min ${String(secs).padStart(2, '0')} s${state.auto ? ' (copie remise automatiquement à la fin du temps)' : ''}.<br>
    Rappel : le ${LV.diploma} ${EXAM.level} est noté sur 100 (4 épreuves de 25 points). Il faut <b>50/100 au total</b> et <b>au moins 5/25 dans chaque épreuve</b>. Cliquez sur un numéro pour lire la correction détaillée ; le bouton « Voir le passage dans le texte » surligne la justification dans le document.</p>
    <div class="res-actions">
      <a class="btn" href="#q1">Lire la correction</a>
      <button class="btn ghost" id="restart">Recommencer l'épreuve</button>
    </div>`;
  $('#results').classList.remove('hidden');
  $('#restart').addEventListener('click', restart);
}

function restart(){
  clear();
  state = { answers: {}, start: null, submitted: false, elapsed: 0 };
  document.body.classList.remove('graded');
  $('#results').classList.add('hidden');
  $('#exam').classList.add('hidden');
  $('#footerSubmit').classList.remove('hidden');
  init();
  window.scrollTo({ top: 0 });
}

/* ---------- Init ---------- */
let resumable = false;
function init(){
  renderShell();
  renderQuestions();
  renderNav();
  $('#cover').classList.remove('hidden');
  resumable = false;
  $('#startBtn').addEventListener('click', () => { startExam(resumable); resumable = false; });
}

$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
$('#submitTop').addEventListener('click', askSubmit);
$('#submitBottom').addEventListener('click', askSubmit);
$('#mCancel').addEventListener('click', closeModal);
$('#mOk').addEventListener('click', () => grade(false));
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeModal();
  if (!PAGED || state.submitted || $('#exam').classList.contains('hidden') || !$('#modal').classList.contains('hidden')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') return go(cur + 1);
  if (e.key === 'ArrowLeft') return go(cur - 1);
  const i = LETTERS.indexOf(e.key.toUpperCase());
  const inp = i >= 0 && document.querySelector(`input[name="q${ALL[cur].id}"][value="${i}"]`);
  if (inp){ inp.checked = true; inp.dispatchEvent(new Event('change')); }
});

init();
const saved = load();
if (saved && saved.start){
  state = saved;
  if (state.submitted) grade(state.auto);
  else if (remaining() > 0){
    resumable = true;
    $('#startBtn').textContent = "Reprendre l'épreuve en cours";
    $('#resumeNote').innerHTML = `Une épreuve est en cours (${Object.keys(state.answers).length} réponse(s), ${Math.ceil(remaining() / 60)} min restantes). <a href="#" id="newExam">Recommencer à zéro</a>`;
    $('#resumeNote').classList.remove('hidden');
    $('#newExam').addEventListener('click', e => { e.preventDefault(); restart(); });
  } else grade(true);
}

/* Test hook: ?autotest=1 answers option A everywhere and submits (used by build_exam.js --test). */
if (new URLSearchParams(location.search).get('autotest')){
  clear(); state = { answers: {}, start: Date.now(), submitted: false, elapsed: 0 };
  startExam(true);
  ALL.forEach(q => { if (q.id !== ALL[ALL.length - 1].id) state.answers[q.id] = 0; });
  grade(false);
}
</script>
</body>
</html>
